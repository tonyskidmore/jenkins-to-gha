        tl.to(A + '#gha-cam', { scale: 1.3, duration: 1.0, ease: 'power2.inOut' }, 1.0);    // punch in on status + job list (anchored bottom-left)

        tl.set(A + '#jobs-count', { textContent: '11 / 11 jobs passed' }, 8.01);
        // Run completed (clip 7.51s): pull back to the whole page, real time from here
        tl.to(A + '#gha-cam', { scale: 1, duration: 0.7, ease: 'power2.inOut' }, 8.01);
        tl.to(A + '#gha-speed-fast', { opacity: 0, duration: 0.15 }, 8.01);
        tl.to(A + '#gha-speed-real', { opacity: 1, duration: 0.15 }, 8.01);
        tl.to(A + '#jobs-count', { opacity: 0, duration: 0.2 }, 8.11);
        tl.to(A + '#jobs-done', { opacity: 1, duration: 0.2 }, 8.11);
        tl.fromTo(A + '.status-pill', { scale: 1 }, { scale: 1.12, duration: 0.2, yoyo: true, repeat: 1 }, 8.11);

        // At 10.0s (55.0s in global time): Outro Hero reveal

          { opacity: 0, scale: 0.95, duration: 0.5, ease: "power2.in" },
