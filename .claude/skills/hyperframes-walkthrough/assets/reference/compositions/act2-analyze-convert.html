<template id="act2-template">
  <div
    data-composition-id="act2"

    <div class="act2-container">
      <!-- Section Header -->
      <div id="act2-header" class="header-section">
        <div class="act-badge">PARTS 2–4 · PIPELINE ENGINE</div>
        <h1 class="act-title">Deterministic AST Analysis & Conversion</h1>
        <p class="act-desc">Jenkins Groovy AST is extracted natively, converted into typed Actions jobs with workspace preservation, and validated.</p>
      </div>

      <!-- 3 Dynamic Process Pillars -->
      <div class="pillars-grid">
        <!-- Pillar 1: Analyze -->
        <div id="pillar-analyze" class="pillar-card">
          <div class="pillar-top">
            <span class="pillar-step-badge">STEP 1</span>
            <span class="pillar-title"><code>j2gha analyze</code></span>
          </div>
          <div class="pillar-icon-box cyan-glow">
            <span class="pillar-symbol">⚙</span>
          </div>
          <h2 class="pillar-heading">Typed IR Extraction</h2>
          <p class="pillar-body">Parsed directly with Jenkins' native Groovy parser to guarantee semantic fidelity.</p>
          
          <div class="metric-box">
            <div class="metric-row">
              <span class="metric-name">Construct Difficulty</span>
              <span class="metric-val text-cyan">23 / 100</span>
            </div>
            <div class="metric-row">
              <span class="metric-name">Extracted Stages</span>
              <span class="metric-val">9 stages · 1 matrix</span>
            </div>
            <div class="metric-row">
              <span class="metric-name">AST Node Type</span>
              <span class="metric-val">Declarative Pipeline IR</span>
            </div>
          </div>
          <div class="pillar-footer">
            <span class="check-pill">✓ Groovy AST Analyzed</span>
          </div>
        </div>

        <!-- Pillar 2: Convert -->
        <div id="pillar-convert" class="pillar-card highlight-card">
          <div class="pillar-top">
            <span class="pillar-step-badge blue-badge">STEP 2</span>
            <span class="pillar-title"><code>j2gha convert</code></span>
          </div>
          <div class="pillar-icon-box blue-glow">
            <span class="pillar-symbol">🔄</span>
          </div>
          <h2 class="pillar-heading">Workflow Synthesis</h2>
          <p class="pillar-body">Generates 9 modular Actions jobs with tarball handoffs between isolated runners.</p>
          
          <div class="metric-box">
            <div class="metric-row">
              <span class="metric-name">Generated Workflow</span>
              <span class="metric-val text-blue">inventory-service.yml</span>
            </div>
            <div class="metric-row">
              <span class="metric-name">Runner Workspaces</span>
              <span class="metric-val"><code>j2gha-ws-*</code> Tarballs</span>
            </div>
            <div class="metric-row">
              <span class="metric-name">State Passing</span>
              <span class="metric-val">Exact Artifact Preservation</span>
            </div>
          </div>
          <div class="pillar-footer">
            <span class="check-pill blue-pill">✓ Deterministic GHA Generated</span>
          </div>
        </div>

        <!-- Pillar 3: Validate -->
        <div id="pillar-validate" class="pillar-card">
          <div class="pillar-top">
            <span class="pillar-step-badge green-badge">STEP 3</span>
            <span class="pillar-title"><code>j2gha validate</code></span>
          </div>
          <div class="pillar-icon-box green-glow">
            <span class="pillar-symbol">🛡</span>
          </div>
          <h2 class="pillar-heading">Multi-Linter Audit</h2>
          <p class="pillar-body">Audited for syntax validity, security postures, and edge-case behavior.</p>
          
          <div class="metric-box">
            <div class="metric-row">
              <span class="metric-name">actionlint Audit</span>
              <span class="metric-val text-green">0 syntax errors</span>
            </div>
            <div class="metric-row">
              <span class="metric-name">zizmor Security</span>
              <span class="metric-val text-green">0 security findings</span>
            </div>
            <div class="metric-row">
              <span class="metric-name">Manual Policy Flag</span>
              <span class="metric-val text-amber">TODO_currentResult (1)</span>
            </div>
          </div>
          <div class="pillar-footer">
            <span class="check-pill green-pill">✓ Fully Passed & Secure</span>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function() {
        const tl = gsap.timeline({ paused: true });

        // Staggered entrance for header and 3 pillars
        tl.fromTo('[data-composition-id="act2"] #act2-header', 
          { opacity: 0, y: -20 }, 
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 
          0.2
        );
        tl.fromTo('[data-composition-id="act2"] #pillar-analyze', 
          { opacity: 0, y: 30, scale: 0.96 }, 
          { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 
          0.4
        );
        tl.fromTo('[data-composition-id="act2"] #pillar-convert', 
          { opacity: 0, y: 30, scale: 0.96 }, 
          { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 
          0.7
        );
        tl.fromTo('[data-composition-id="act2"] #pillar-validate', 
          { opacity: 0, y: 30, scale: 0.96 }, 
          { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 
          1.0
        );

        // Highlight convert pillar during narration mid-point
        tl.to('[data-composition-id="act2"] #pillar-convert', 
          { borderColor: "#60a5fa", boxShadow: "0 24px 48px rgba(59, 130, 246, 0.25)", duration: 0.5 }, 
          5.0
        );

        // Highlight validate pillar during linter mention
        tl.to('[data-composition-id="act2"] #pillar-validate', 
          { borderColor: "#34d399", boxShadow: "0 24px 48px rgba(16, 185, 129, 0.25)", duration: 0.5 }, 
          10.0
        );

        // Exit transition before 15.0s
        tl.to('[data-composition-id="act2"] .act2-container', 
          { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, 
          14.6
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["act2"] = tl;
      })();
