    <script>
      (function() {
        const tl = gsap.timeline({ paused: true });

        // Initial entrance
        tl.fromTo('[data-composition-id="act1"] #act1-left-col', 
          { opacity: 0, x: -40 }, 
          { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 
          0.2
        );
        tl.fromTo('[data-composition-id="act1"] #act1-right-col', 
          { opacity: 0, scale: 0.96 }, 
          { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 
          0.4
        );
        // The live clip starts at 0.6s; times below are 0.6 + clip time from assets/clips/jenkins_run.map.json.
        const A = '[data-composition-id="act1"] ';
        const show = (sel, at, d = 0.25) => tl.to(A + sel, { opacity: 1, duration: d }, at);
        const hide = (sel, at, d = 0.25) => tl.to(A + sel, { opacity: 0, duration: d }, at);

        // URL bar follows the real navigation
        hide('#url-job', 1.5, 0.1); show('#url-stages', 1.53, 0.1);          // stages page (clip 0.93)
        hide('#url-stages', 6.68, 0.1); show('#url-input', 6.71, 0.1);       // input page (clip 6.11)
        hide('#url-input', 11.12, 0.1); show('#url-stages', 11.15, 0.1);     // back to stages (clip 10.55)

        // Speed badge: 3x while the stages run (clip 1.15-3.68), real time otherwise
        show('#speed-badge', 1.0, 0.3);
        hide('#speed-real', 1.75, 0.15); show('#speed-fast', 1.75, 0.15);
        hide('#speed-fast', 4.28, 0.15); show('#speed-real', 4.28, 0.15);
        hide('#speed-badge', 14.2, 0.3);

        // Camera: punch in on the stage graph while it grows, pull back for the paused gate
        tl.to(A + '#jenkins-cam', { scale: 1.25, transformOrigin: '50% 0%', duration: 0.9, ease: 'power2.inOut' }, 1.9);
        tl.to(A + '#jenkins-cam', { scale: 1, duration: 0.6, ease: 'power2.inOut' }, 4.2);
        show('#gate-pill', 4.4, 0.35);
        hide('#gate-pill', 6.5, 0.2);

        // Input page: zoom onto the CHANGE_TICKET form while the ticket is typed and Deploy is clicked
        tl.set(A + '#jenkins-cam', { transformOrigin: '57% 20%' }, 6.71);
        tl.to(A + '#jenkins-cam', { scale: 1.5, duration: 0.8, ease: 'power2.inOut' }, 7.0);
        tl.fromTo(A + '#approval-callout', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(1.2)' }, 10.85);
        tl.to(A + '#jenkins-cam', { scale: 1, duration: 0.3, ease: 'power2.in' }, 10.85);

        // After approval (full graph, no zoom): Deploy and Post Actions run, then the build finishes (SUCCESS at clip 11.04)
        tl.to(A + '#approval-callout', { opacity: 0, y: 20, duration: 0.4, ease: 'power2.in' }, 12.6);
        tl.fromTo(A + '#act1-complete-banner',
          { opacity: 0, y: -20 },
          { opacity: 1, y: 0, duration: 0.6, ease: 'back.out(1.2)' },
          12.4
        );
        tl.fromTo(A + '#act1-artifacts',
          { borderColor: "rgba(255, 255, 255, 0.1)" },
          { borderColor: "rgba(16, 185, 129, 0.6)", duration: 0.5 },
          12.8
        );

        // Exit transition before 15.0s
        tl.to('[data-composition-id="act1"] .act1-container', 
          { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, 
          14.6
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["act1"] = tl;
      })();
