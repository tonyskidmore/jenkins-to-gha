# gitleaks configuration: the default rules, minus a known false positive.
[extend]
useDefault = true

[[allowlists]]
description = "Jenkins plugin pins (name:version) match generic-api-key"
paths = ['''^docker/jenkins/plugins\.txt$''']

[[allowlists]]
description = "The harness's fake credentials (jenkins/localize.py FAKE_*), which run logs show by design"
regexTarget = "match"
regexes = ['''j2gha-(?:user|fake-[a-z]+)''']
