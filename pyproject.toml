[project]
name = "j2gha"
version = "0.2.0"
description = "Jenkins to GitHub Actions analysis, conversion and validation harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    # j2gha docs: HTML -> Markdown for the local documentation bundles
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
j2gha = "j2gha.cli:main"

[project.urls]
Repository = "https://github.com/tonyskidmore/jenkins-to-gha"
Documentation = "https://github.com/tonyskidmore/jenkins-to-gha/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["j2gha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: runs the harness end to end (Jenkins controller + act, minutes); opt in with `pytest -m e2e`",
    "docker: needs a local harness Docker image (skipped when it is absent); deselect with -m 'not docker'",
]

[dependency-groups]
dev = ["pytest>=8"]
