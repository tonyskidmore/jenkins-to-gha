# j2gha selfhosted variant (full) of examples/003
name: j2gha harness run
on:
  push:
    branches:
    - j2gha/run/003-full-selfhosted-20261012083716
  workflow_dispatch:
permissions:
  contents: read
env:
  BRANCH_NAME: main
  TAG_NAME: ''
  CHANGE_ID: ''
  DEPENDENCIES_DIR: dependencies/
  VERSION: 'TODO-j2gha: feDetermineVersionFromGit()'
  ARTIFACT_FILENAME: robot-descriptions
  DIST_DIR: dist/usr/share/robot-descriptions
  GIT_COMMIT: 37c4be2ce36ae6d354339509a3d324063fc99968
  GIT_BRANCH: origin/main
  GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
defaults:
  run:
    shell: bash
jobs:
  check-commit-message:
    name: Check Commit Message, Get Ready
    runs-on:
    - self-hosted
    - j2gha-5b18ed28
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        repository: frankarobotics/franka_description
        ref: 37c4be2ce36ae6d354339509a3d324063fc99968
    - name: Set pipeline environment (Jenkins environment {})
      run: 'true'
    - name: 'Check Commit Message: git log -1 --pretty=format:%s'
      id: s1
      run: git log -1 --pretty=format:%s
    - name: 'Check Commit Message: Groovy if (manual)'
      id: s2
      run: 'echo "::warning::manual migration: Groovy condition at line 39: skipKeywords.any { commitMsg.toLowerCase().contains(it)
        }"'
    - name: 'Get Ready: notifyBitbucket (manual migration)'
      id: s3
      run: echo "::warning::Jenkins step 'notifyBitbucket' requires manual migration"
    - name: 'Get Ready: git clean -x -d -f'
      id: s4
      run: git clean -x -d -f
    - name: Hand on the pipeline workspace (archive)
      if: always()
      shell: bash
      run: |
        tar --exclude=./.j2gha-ws --exclude=./.j2gha-ws.tgz --exclude=./.j2gha-ws.changes \
          -czf "$RUNNER_TEMP/j2gha-ws.tgz" -C "$GITHUB_WORKSPACE" .
        mv "$RUNNER_TEMP/j2gha-ws.tgz" "$GITHUB_WORKSPACE/.j2gha-ws.tgz"
    - name: Hand on the pipeline workspace (upload)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: j2gha-ws-check-commit-message
        path: .j2gha-ws.tgz
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
        include-hidden-files: true
  run-urdf-tests:
    name: Run URDF tests
    needs: check-commit-message
    runs-on:
    - self-hosted
    - j2gha-5b18ed28
    timeout-minutes: 10
    steps:
    - name: Restore pipeline workspace (check-commit-message)
      id: j2gha-ws-check-commit-message
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      continue-on-error: true
      with:
        name: j2gha-ws-check-commit-message
        path: .j2gha-ws/check-commit-message
    - name: Restore pipeline workspace (merge)
      id: j2gha-ws-restore
      if: always()
      shell: bash
      env:
        J2GHA_WS_ORDER: check-commit-message
        J2GHA_WS_LINEAGE: 'check-commit-message:'
        J2GHA_WS_HEADS: check-commit-message
        J2GHA_WS_RESULTS: check-commit-message=${{ needs.check-commit-message.result }}
        J2GHA_WS_FALLBACKS: 'check-commit-message:'
      run: |
        ws="$GITHUB_WORKSPACE"
        d="$ws/.j2gha-ws"
        # the downloaded producers a producer descends from
        ancestors() {
          local line
          while IFS= read -r line; do
            if [ "${line%%:*}" = "$1" ]; then printf '%s\n' "${line#*:}"; fi
          done <<< "$J2GHA_WS_LINEAGE"
        }
        present() { [ -f "$d/$1/.j2gha-ws.tgz" ]; }
        # read-only directories (a Go module cache) need write permission to be removed
        remove() { rm -rf -- "$@" 2>/dev/null || { chmod -R u+w -- "$@"; rm -rf -- "$@"; }; }
        isdir() { [ -d "$1" ] && [ ! -L "$1" ]; }
        # replay a branch's own changes (its change list) onto the workspace
        replay() {
          local src="$d/$1" t="$d/.replay" rec p a
          local -a recs=() gone=()
          local -A want=() locked=() removed=()
          if [ ! -f "$src/.j2gha-ws.changes" ]; then
            echo "::error::the workspace of job '$1' has no change list (the workspace it started from was not recorded): it cannot be merged"
            exit 1
          fi
          mapfile -t recs < "$src/.j2gha-ws.changes"
          for rec in "${recs[@]}"; do
            printf -v p '%b' "${rec:1}"
            if [ "${rec:0:1}" = D ]; then
              removed[$p]=1
              continue
            fi
            want[$p]=1
            # a parent directory an earlier branch removed or replaced is taken from this branch too
            a=$p
            while a=${a%/*}; [ "$a" != . ]; do
              if isdir "$ws/$a"; then break; fi
              want[$a]=1
            done
          done
          # a removed directory takes its contents with it: only the top-most removed entries are removed
          for p in "${!removed[@]}"; do
            a=$p
            while a=${a%/*}; [ "$a" != . ] && [ -z "${removed[$a]-}" ]; do :; done
            if [ "$a" = . ]; then gone+=("$p"); fi
          done
          # only the entries to copy come out of the branch's workspace (parents first)
          mkdir -p "$t"
          printf '%s\0' "${!want[@]}" | LC_ALL=C sort -z > "$d/.want"
          if [ "${#want[@]}" -gt 0 ]; then tar -xzpf "$src/.j2gha-ws.tgz" -C "$t" --null --no-unquote --no-recursion -T "$d/.want"; fi
          # read-only directories (a Go module cache) are opened for the changes; their modes are put back afterwards
          for p in "${gone[@]}" "${!want[@]}"; do
            a=${p%/*}
            if [ "$a" != . ] && isdir "$ws/$a" && [ ! -w "$ws/$a" ] && [ -z "${locked[$a]-}" ]; then
              locked[$a]=$(stat -c %a "$ws/$a")
              chmod u+w "$ws/$a"
            fi
          done
          for p in "${gone[@]}"; do remove "$ws/$p"; done
          # clear what is in the way of an entry's type: a file or link where the branch has a directory, or the reverse
          for p in "${!want[@]}"; do
            if isdir "$t/$p"; then
              if [ -L "$ws/$p" ] || { [ -e "$ws/$p" ] && [ ! -d "$ws/$p" ]; }; then rm -f -- "$ws/$p"; fi
              if isdir "$ws/$p" && [ ! -w "$ws/$p" ]; then chmod u+w "$ws/$p"; fi  # tar sets the branch's mode
            elif isdir "$ws/$p"; then
              remove "$ws/$p"
            fi
          done
          if [ "${#want[@]}" -gt 0 ]; then
            # tar sets directory modes after their contents
            tar -C "$t" --null --no-unquote --no-recursion -T "$d/.want" -cf - | tar -xpf - -C "$ws"
          fi
          for a in "${!locked[@]}"; do
            if [ -z "${want[$a]-}" ] && isdir "$ws/$a"; then chmod "${locked[$a]}" "$ws/$a"; fi
          done
          remove "$t"
        }
        # every producer the restore relies on is accounted for: its workspace arrived, or its job was skipped and the
        # producers it would have started from are accounted for in turn (the fallback chain actually used)
        declare -A result=() fallback=() seen=()
        for r in $J2GHA_WS_RESULTS; do result[${r%%=*}]=${r#*=}; done
        while IFS= read -r line; do
          if [ -n "$line" ]; then fallback[${line%%:*}]=${line#*:}; fi
        done <<< "$J2GHA_WS_FALLBACKS"
        account() {
          local p=$1 f
          if [ -n "${seen[$p]-}" ] || present "$p"; then return 0; fi
          seen[$p]=1
          case "${result[$p]-}" in
            success|failure)
              echo "::error::job '$p' ran (${result[$p]}) but its workspace did not arrive: restoring an older one would lose its changes"
              exit 1 ;;
            skipped|cancelled) ;;
            *) echo "::warning::the workspace of job '$p' did not arrive and its result is not known here (not a job this one needs): taken as skipped - if it ran, its changes are missing" ;;
          esac
          for f in ${fallback[$p]-}; do account "$f"; done
        }
        for p in $J2GHA_WS_HEADS; do account "$p"; done
        # the workspaces to merge: those downloaded that no other downloaded one descends from
        frontier=()
        for p in $J2GHA_WS_ORDER; do
          present "$p" || continue
          covered=false
          for q in $J2GHA_WS_ORDER; do
            if [ "$q" != "$p" ] && present "$q"; then
              case " $(ancestors "$q") " in *" $p "*) covered=true ;; esac
            fi
          done
          if [ "$covered" = false ]; then frontier+=("$p"); fi
        done
        restored=false
        if [ "${#frontier[@]}" -gt 0 ]; then
          # the restored workspace replaces what the job started with (act copies the repository into every job)
          shopt -s dotglob nullglob
          for e in "$ws"/*; do
            if [ "$e" != "$d" ]; then remove "$e"; fi
          done
          shopt -u dotglob nullglob
          tar -xzpf "$d/${frontier[0]}/.j2gha-ws.tgz" -C "$ws"
          for f in "${frontier[@]:1}"; do replay "$f"; done
          restored=true
        fi
        remove "$d"
        echo "restored=$restored" >> "$GITHUB_OUTPUT"
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        repository: frankarobotics/franka_description
        ref: 37c4be2ce36ae6d354339509a3d324063fc99968
    - name: Build agent image (agent dockerfile)
      run: docker build -t j2gha-agent:local -f .docker/Dockerfile .docker
    - name: 'Run URDF tests: .ci/run_urdf_tests.sh'
      id: s5
      run: docker run --rm -v "$PWD":"$PWD" -w "$PWD" --env-file <(env | grep -v '^PATH=') j2gha-agent:local sh -c .ci/run_urdf_tests.sh
    - name: Hand on the pipeline workspace (archive)
      if: always()
      shell: bash
      run: |
        tar --exclude=./.j2gha-ws --exclude=./.j2gha-ws.tgz --exclude=./.j2gha-ws.changes \
          -czf "$RUNNER_TEMP/j2gha-ws.tgz" -C "$GITHUB_WORKSPACE" .
        mv "$RUNNER_TEMP/j2gha-ws.tgz" "$GITHUB_WORKSPACE/.j2gha-ws.tgz"
    - name: Hand on the pipeline workspace (upload)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: j2gha-ws-run-urdf-tests
        path: .j2gha-ws.tgz
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
        include-hidden-files: true
  build-robot-urdfs-and-srdfs:
    name: Build robot URDFs and SRDFs
    needs: run-urdf-tests
    runs-on:
