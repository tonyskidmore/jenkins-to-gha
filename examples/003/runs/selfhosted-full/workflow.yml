    - name: 'Build URDF and SRDF: ./scripts/create_urdf.sh --no-ee --no-prefix ${ROBOT}'
      id: s6
      run: ./scripts/create_urdf.sh --no-ee --no-prefix ${ROBOT}
    - name: 'Build URDF and SRDF: dir urdfs'
      id: s7
      run: mkdir -p -- "$J2GHA_DIR"
      env:
        J2GHA_DIR: urdfs
    - name: 'Build URDF and SRDF: stash ROBOT_${ROBOT}_urdf'
      id: s8
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: stash-ROBOT_-ROBOT-_urdf
        path: |-
          urdfs/${{ env.ROBOT }}.urdf
          !urdfs/**/.git
          !urdfs/**/.git/**
          !urdfs/**/.gitignore
          !urdfs/**/.gitattributes
          !urdfs/**/.gitmodules
          !urdfs/**/.svn
          !urdfs/**/.svn/**
          !urdfs/**/.hg
          !urdfs/**/.hg/**
          !urdfs/**/.hgignore
          !urdfs/**/.hgtags
          !urdfs/**/.bzr
          !urdfs/**/.bzr/**
          !urdfs/**/.bzrignore
          !urdfs/**/CVS
          !urdfs/**/CVS/**
          !urdfs/**/.cvsignore
          !urdfs/**/SCCS
