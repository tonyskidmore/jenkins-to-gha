# j2gha selfhosted variant (full) of examples/111
name: j2gha harness run
on:
  push:
    branches:
    - j2gha/run/111-full-selfhosted-20261012091024
  workflow_dispatch:
permissions:
  contents: read
env:
  BRANCH_NAME: main
  TAG_NAME: ''
  CHANGE_ID: ''
  JOB_NAME: ${{ github.workflow }}
  APPLICATION_NAME: 'TODO-j2gha: application'
  GIT_COMMIT: c4b839ddc8934f978a3f5c336dd144bfaf5fc464
  GIT_BRANCH: origin/main
  GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
defaults:
  run:
    shell: bash
jobs:
  checkout:
    name: Checkout, Install, Test, Build
    runs-on:
    - self-hosted
    - j2gha-33550ae7
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        repository: oneanupam/jenkins-shared-libs
        ref: c4b839ddc8934f978a3f5c336dd144bfaf5fc464
    - name: 'Checkout: checkout'
      id: s1
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        repository: oneanupam/jenkins-shared-libs
        ref: c4b839ddc8934f978a3f5c336dd144bfaf5fc464
    - name: 'Install: echo install'
      id: s2
      run: echo install
    - name: 'Test: mkdir -p reports && printf ''<testsuite name="unit" tests="1" failures='
      id: s3
      run: mkdir -p reports && printf '<testsuite name="unit" tests="1" failures="0" errors="0" skipped="0"><testcase classname="unit"
        name="smoke"/></testsuite>\n' > reports/junit-unit.xml
    - name: 'Build: mkdir -p dist && cp README.md dist/'
      id: s4
      run: mkdir -p dist && cp README.md dist/
    - name: 'post: junit summary'
      id: s5
      if: (always()) && (always())
      run: |-
        python3 - <<'PY'
        import glob, os, xml.etree.ElementTree as ET
        files = [f for p in os.environ['J2GHA_JUNIT'].splitlines() for f in glob.glob(p, recursive=True)]
        t = f = e = s = 0
        for x in files:
            r = ET.parse(x).getroot()
            for ts in ([r] if r.tag == 'testsuite' else r.iter('testsuite')):
                t += int(ts.get('tests', 0)); f += int(ts.get('failures', 0)); e += int(ts.get('errors', 0)); s += int(ts.get('skipped', 0))
        with open(os.environ.get('GITHUB_STEP_SUMMARY', os.devnull), 'a') as out:
            out.write(f'### JUnit: {t} tests, {f} failures, {e} errors, {s} skipped ({len(files)} files)\n')
        if not files and not True:
            raise SystemExit('no test report files found')
        PY
      env:
        J2GHA_JUNIT: '**/junit-*.xml'
    - name: 'post: upload test reports'
      id: s6
      if: (always()) && (always())
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: test-reports-6
        path: '**/junit-*.xml'
        if-no-files-found: ignore
        retention-days: 1
    - name: 'post: archive artifacts'
      id: s7
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: artifacts-7
        path: |-
          dist/**
          !**/.git
          !**/.git/**
          !**/.gitignore
          !**/.gitattributes
          !**/.gitmodules
          !**/.svn
          !**/.svn/**
          !**/.hg
          !**/.hg/**
          !**/.hgignore
          !**/.hgtags
          !**/.bzr
          !**/.bzr/**
          !**/.bzrignore
          !**/CVS
          !**/CVS/**
          !**/.cvsignore
          !**/SCCS
          !**/SCCS/**
          !**/vssver.scc
          !**/.DS_Store
          !**/*~
          !**/#*#
          !**/.#*
          !**/%*%
          !**/._*
          .j2gha-artifact-root
        if-no-files-found: ignore
        include-hidden-files: true
        retention-days: 1
    - name: 'post: echo'
      id: s8
      if: failure()
      run: echo "${APPLICATION_NAME} failed"
    - name: 'post: echo'
      id: s9
      if: success()
      run: echo "${APPLICATION_NAME} completed successfully"
