# j2gha selfhosted variant (full) of examples/107
name: 'j2gha 107: oracle/weblogic-kubernetes-operator Jenkinsfile (j2gha)'
on:
  push:
    branches:
    - j2gha/run/107-full-selfhosted-20261010103412
  workflow_dispatch:
permissions:
  contents: read
env:
  BRANCH_NAME: main
  TAG_NAME: ''
  CHANGE_ID: ''
  BUILD_TAG: gha-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.run_number }}
  JOB_NAME: ${{ github.workflow }}
  GIT_BRANCH: origin/main
  WORKSPACE: ${{ github.workspace }}
  MAVEN_PROFILE_NAME: ${{ github.event_name != 'workflow_dispatch' && 'wls-srg' || format('{0}', inputs.MAVEN_PROFILE_NAME)
    }}
  IT_TEST: ${{ github.event_name != 'workflow_dispatch' && '' || format('{0}', inputs.IT_TEST) }}
  OPERATOR_LOG_LEVEL: ${{ github.event_name != 'workflow_dispatch' && '' || format('{0}', inputs.OPERATOR_LOG_LEVEL) }}
  KIND_VERSION: ${{ github.event_name != 'workflow_dispatch' && '0.32.0' || format('{0}', inputs.KIND_VERSION) }}
  KUBE_VERSION: ${{ github.event_name != 'workflow_dispatch' && '1.36.1' || format('{0}', inputs.KUBE_VERSION) }}
  HELM_VERSION: ${{ github.event_name != 'workflow_dispatch' && '3.11.2' || format('{0}', inputs.HELM_VERSION) }}
  ISTIO_VERSION: ${{ github.event_name != 'workflow_dispatch' && '1.27.2' || format('{0}', inputs.ISTIO_VERSION) }}
  PARALLEL_RUN: ${{ github.event_name != 'workflow_dispatch' && 'true' || format('{0}', inputs.PARALLEL_RUN) }}
  NUMBER_OF_THREADS: ${{ github.event_name != 'workflow_dispatch' && '3' || format('{0}', inputs.NUMBER_OF_THREADS) }}
  WDT_DOWNLOAD_URL: ${{ github.event_name != 'workflow_dispatch' && 'https://github.com/oracle/weblogic-deploy-tooling/releases/latest'
    || format('{0}', inputs.WDT_DOWNLOAD_URL) }}
  WIT_DOWNLOAD_URL: ${{ github.event_name != 'workflow_dispatch' && 'https://github.com/oracle/weblogic-image-tool/releases/latest'
    || format('{0}', inputs.WIT_DOWNLOAD_URL) }}
  REMOTECONSOLE_VERSION: ${{ github.event_name != 'workflow_dispatch' && '2.4.7' || format('{0}', inputs.REMOTECONSOLE_VERSION)
    }}
  TEST_IMAGES_REPO: ${{ github.event_name != 'workflow_dispatch' && '' || format('{0}', inputs.TEST_IMAGES_REPO) }}
  BASE_IMAGES_REPO: ${{ github.event_name != 'workflow_dispatch' && '' || format('{0}', inputs.BASE_IMAGES_REPO) }}
  WEBLOGIC_IMAGE_NAME: ${{ github.event_name != 'workflow_dispatch' && 'test-images/weblogic_cpu' || format('{0}', inputs.WEBLOGIC_IMAGE_NAME)
    }}
  WEBLOGIC_IMAGE_TAG: ${{ github.event_name != 'workflow_dispatch' && '14.1.2.0-generic-jdk17-ol8' || format('{0}', inputs.WEBLOGIC_IMAGE_TAG)
    }}
  FMWINFRA_IMAGE_NAME: ${{ github.event_name != 'workflow_dispatch' && 'test-images/fmw-infrastructure_cpu' || format('{0}',
    inputs.FMWINFRA_IMAGE_NAME) }}
  FMWINFRA_IMAGE_TAG: ${{ github.event_name != 'workflow_dispatch' && '14.1.2.0-jdk17-ol8' || format('{0}', inputs.FMWINFRA_IMAGE_TAG)
    }}
  DB_IMAGE_NAME: ${{ github.event_name != 'workflow_dispatch' && 'test-images/database/enterprise' || format('{0}', inputs.DB_IMAGE_NAME)
    }}
  DB_IMAGE_TAG: ${{ github.event_name != 'workflow_dispatch' && '19.3.0.0' || format('{0}', inputs.DB_IMAGE_TAG) }}
  MONITORING_EXPORTER_BRANCH: ${{ github.event_name != 'workflow_dispatch' && 'main' || format('{0}', inputs.MONITORING_EXPORTER_BRANCH)
    }}
  MONITORING_EXPORTER_WEBAPP_VERSION: ${{ github.event_name != 'workflow_dispatch' && '' || format('{0}', inputs.MONITORING_EXPORTER_WEBAPP_VERSION)
    }}
  PROMETHEUS_CHART_VERSION: ${{ github.event_name != 'workflow_dispatch' && '17.0.0' || format('{0}', inputs.PROMETHEUS_CHART_VERSION)
    }}
  GRAFANA_CHART_VERSION: ${{ github.event_name != 'workflow_dispatch' && '6.38.6' || format('{0}', inputs.GRAFANA_CHART_VERSION)
    }}
  COLLECT_LOGS_ON_SUCCESS: ${{ github.event_name != 'workflow_dispatch' && 'false' || format('{0}', inputs.COLLECT_LOGS_ON_SUCCESS)
    }}
  ocir_creds: wkt-ocir-creds
  kind_name: kind
  kind_network: kind
  registry_name: kind-registry
  registry_port: '5000'
  wle_download_url: https://github.com/oracle/weblogic-logging-exporter/releases/latest
  GIT_COMMIT: a1028378bd770495180ddabca31e8d1399be7900
  GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
defaults:
  run:
    shell: bash
jobs:
  filter-unwanted-branches:
    name: Filter unwanted branches, Sync
    runs-on:
    - self-hosted
    - j2gha-c8fbc24f
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        repository: oracle/weblogic-kubernetes-operator
        ref: a1028378bd770495180ddabca31e8d1399be7900
    - name: Set pipeline environment (Jenkins environment {})
      run: |-
        export ocir_host="${WKT_OCIR_HOST}"; echo "ocir_host=${ocir_host}" >> "$GITHUB_ENV"
        export wko_tenancy="${WKT_TENANCY}"; echo "wko_tenancy=${wko_tenancy}" >> "$GITHUB_ENV"
        export outdir="${WORKSPACE}/staging"; echo "outdir=${outdir}" >> "$GITHUB_ENV"
        export result_root="${outdir}/wl_k8s_test_results"; echo "result_root=${result_root}" >> "$GITHUB_ENV"
        export pv_root="${outdir}/k8s-pvroot"; echo "pv_root=${pv_root}" >> "$GITHUB_ENV"
        export kubeconfig_file="${result_root}/kubeconfig"; echo "kubeconfig_file=${kubeconfig_file}" >> "$GITHUB_ENV"
        export registry_host="${registry_name}"; echo "registry_host=${registry_host}" >> "$GITHUB_ENV"
        start_time="$(date +"%Y-%m-%d %H:%M:%S")"; export start_time; echo "start_time=${start_time}" >> "$GITHUB_ENV"
    - name: Set up JDK (jdk25)
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '25'
    - name: 'Filter unwanted branches: enter stage'
      id: s1
      if: (env.CHANGE_ID != '' || env.BRANCH_NAME == 'main' || env.BRANCH_NAME == 'release/4.0' || env.BRANCH_NAME == 'release/3.4')
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Workaround JENKINS-41929 Parameters bug: echo'
      id: s2
      if: steps.s1.outputs.run == 'true'
      run: echo "Initialize parameters as environment variables due to https://issues.jenkins-ci.org/browse/JENKINS-41929"
    - name: 'Workaround JENKINS-41929 Parameters bug: evaluate (manual migration)'
      id: s3
      if: steps.s1.outputs.run == 'true'
      run: echo "::warning::Jenkins step 'evaluate' requires manual migration"
    - name: 'Echo environment: export PATH=${runtime_path}'
      id: s4
      if: steps.s1.outputs.run == 'true'
      run: |-
        export runtime_path="${WORKSPACE}/bin:${PATH}"
        export PATH=${runtime_path}
        env|sort
        java -version
        mvn --version
        python --version
        echo podman version  # j2gha-local: no container runtime in the harness
        ulimit -a
        ulimit -aH
    - name: 'Echo environment: Groovy if (manual)'
      id: s5
      if: steps.s1.outputs.run == 'true'
      run: 'echo "::warning::manual migration: Groovy condition at line 247: knd != null && k8s != null"'
    - name: 'Echo environment: echo'
      id: s6
      if: steps.s1.outputs.run == 'true'
      run: |-
        export runtime_path="${WORKSPACE}/bin:${PATH}"
        echo "Kind Image = ${_kind_image}"
    - name: 'Echo environment: if (line 262)'
      id: s7
      if: (steps.s1.outputs.run == 'true') && (env.JOB_NAME == 'wko-kind-k8sversion')
      run: echo "taken=true" >> "$GITHUB_OUTPUT"
    - name: 'Echo environment: if (line 262)'
      id: s8
      if: (steps.s1.outputs.run == 'true') && (steps.s7.outcome == 'skipped')
      run: echo "taken=false" >> "$GITHUB_OUTPUT"
    - name: 'Build WebLogic Kubernetes Operator: mkdir -p operator/target && echo built > operator/target/weblogic-kube'
      id: s9
      if: steps.s1.outputs.run == 'true'
      run: mkdir -p operator/target && echo built > operator/target/weblogic-kubernetes-operator.jar
    - name: 'Make Workspace bin directory: mkdir -m777 -p ${WORKSPACE}/bin'
      id: s10
      if: steps.s1.outputs.run == 'true'
      run: mkdir -m777 -p ${WORKSPACE}/bin
    - name: 'Make Workspace bin directory: printf ''%s\n'' ''#!/bin/sh'' ''[ -p /dev/stdin ] && cat >/dev/null'' ''echo'
      id: s11
      if: steps.s1.outputs.run == 'true'
      run: printf '%s\n' '#!/bin/sh' '[ -p /dev/stdin ] && cat >/dev/null' 'echo "podman $* (j2gha-local stub)"' > ${WORKSPACE}/bin/podman
        && chmod +x ${WORKSPACE}/bin/podman
    - name: 'Install Helm: export PATH=${runtime_path}'
      id: s12
      if: steps.s1.outputs.run == 'true'
      run: |-
        export runtime_path="${WORKSPACE}/bin:${PATH}"
        export PATH=${runtime_path}
        mkdir -p linux-amd64 && printf '%s\n' '#!/bin/sh' '[ -p /dev/stdin ] && cat >/dev/null' 'echo "helm $* (j2gha-local stub v${HELM_VERSION})"' > linux-amd64/helm && chmod +x linux-amd64/helm && tar zcf helm.tar.gz linux-amd64 && rm -rf linux-amd64  # j2gha-local: was oci os object get of helm-v${HELM_VERSION}.tar.gz (OCI instance principal); packs a stub helm the same way
        tar zxf helm.tar.gz
        mv linux-amd64/helm ${WORKSPACE}/bin/helm
        rm -rf linux-amd64
        helm version
    - name: 'Run Helm installation tests: export PATH="${WORKSPACE}/bin:${PATH}"'
      id: s13
      if: steps.s1.outputs.run == 'true'
      run: |-
        export PATH="${WORKSPACE}/bin:${PATH}"
        echo mvn -pl kubernetes -P helm-installation-test verify  # j2gha-local: the chart tests need a Kubernetes cluster
    - name: 'Install kubectl: export PATH=${runtime_path}'
      id: s14
      if: steps.s1.outputs.run == 'true'
      run: |-
        export runtime_path="${WORKSPACE}/bin:${PATH}"
        export KUBE_VERSION="${KUBE_VERSION}"
        export PATH=${runtime_path}
        printf '%s\n' '#!/bin/sh' '[ -p /dev/stdin ] && cat >/dev/null' 'echo "kubectl $* (j2gha-local stub v${KUBE_VERSION})"' > ${WORKSPACE}/bin/kubectl  # j2gha-local: was oci os object get of kubectl-v${KUBE_VERSION} (OCI instance principal); writes a stub kubectl
        chmod +x ${WORKSPACE}/bin/kubectl
        kubectl version --client=true
    - name: 'Install kind: export PATH=${runtime_path}'
      id: s15
      if: steps.s1.outputs.run == 'true'
      run: |-
        export runtime_path="${WORKSPACE}/bin:${PATH}"
        export PATH=${runtime_path}
        printf '%s\n' '#!/bin/sh' '[ -p /dev/stdin ] && cat >/dev/null' 'echo "kind $* (j2gha-local stub v${KIND_VERSION})"' > ${WORKSPACE}/bin/kind  # j2gha-local: was oci os object get of kind-v${KIND_VERSION} (OCI instance principal); writes a stub kind
        chmod +x "${WORKSPACE}/bin/kind"
        kind version
    - name: 'Preparing Integration Test Environment: mkdir -m777 -p ${result_root}'
      id: s16
      if: steps.s1.outputs.run == 'true'
      run: mkdir -m777 -p ${result_root}
    - name: 'Preparing Integration Test Environment: echo'
      id: s17
      if: steps.s1.outputs.run == 'true'
      run: echo "Results will be in ${result_root}"
    - name: 'Preparing Integration Test Environment: mkdir -m777 -p ${pv_root}'
      id: s18
      if: steps.s1.outputs.run == 'true'
      run: mkdir -m777 -p ${pv_root}
    - name: 'Preparing Integration Test Environment: echo'
      id: s19
      if: steps.s1.outputs.run == 'true'
      run: echo "Persistent volume files, if any, will be in ${pv_root}"
    - name: 'Start registry container: export PATH=${runtime_path}'
      id: s20
      if: steps.s1.outputs.run == 'true'
      run: |-
        export runtime_path="${WORKSPACE}/bin:${PATH}"
        export PATH=${runtime_path}

        running="$(podman container inspect -f '{{.State.Running}}' "${registry_name}" 2>/dev/null || true)"
        if [ "${running}" = 'true' ]; then
          echo "Stopping the registry container ${registry_name}"
          podman stop "${registry_name}"
          podman rm --force "${registry_name}"
        fi

        podman run -d --restart=always -p "127.0.0.1:${registry_port}:5000" --name "${registry_name}"                                 ${ocir_host}/${wko_tenancy}/test-images/docker/registry:2.8.2
        echo "Registry Host: ${registry_host}"
    - name: 'Create kind cluster: stage environment'
      id: s21
      if: steps.s1.outputs.run == 'true'
      run: 'true'
    - name: 'Create kind cluster: export PATH=${runtime_path}'
      id: s22
      if: steps.s1.outputs.run == 'true'
      run: |-
        export runtime_path="${WORKSPACE}/bin:${PATH}"
        kind_image="$(echo -n ${_kind_image})"; export kind_image
        export PATH=${runtime_path}
                                    export KIND_EXPERIMENTAL_PROVIDER=podman

                                    podman version
                                    cat /etc/systemd/system/user@.service.d/delegate.conf || true  # j2gha-local: informational; the file does not exist in the harness
                                    cat /etc/modules-load.d/iptables.conf || true  # j2gha-local: informational; the file does not exist in the harness
                                    lsmod|grep -E "^ip_tables|^iptable_filter|^iptable_nat|^ip6" || true  # j2gha-local: informational; no kmod/no matching modules in a container

                                    if kind delete cluster --name ${kind_name} --kubeconfig "${kubeconfig_file}"; then
                                        echo "Deleted orphaned kind cluster ${kind_name}"
                                    fi
                                    # settings needed by elastic logging tests
                                    echo "running sudo sysctl -w vm.max_map_count=262144"
                                    echo sudo sysctl -w vm.max_map_count=262144  # j2gha-local: no sudo in the harness
                                    cat <<EOF | kind create cluster --name "${kind_name}" --kubeconfig "${kubeconfig_file}" --config=-
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        containerdConfigPatches:
        - |-
          [plugins."io.containerd.grpc.v1.cri".registry]
            config_path = "/etc/containerd/certs.d"
        nodes:
          - role: control-plane
            image: ${kind_image}
          - role: worker
            image: ${kind_image}
            extraPortMappings:
              - containerPort: 30511
                hostPort: 1511
              - containerPort: 32480
                hostPort: 2480
              - containerPort: 32490
                hostPort: 2490
              - containerPort: 30080
                hostPort: 2080
              - containerPort: 30443
                hostPort: 2043
              - containerPort: 30180
                hostPort: 2090
              - containerPort: 30143
                hostPort: 2053
              - containerPort: 31000
                hostPort: 2100
              - containerPort: 31004
                hostPort: 2104
              - containerPort: 31008
                hostPort: 2108
              - containerPort: 31012
                hostPort: 2112
              - containerPort: 31016
                hostPort: 2116
              - containerPort: 31020
                hostPort: 2120
              - containerPort: 31024
                hostPort: 2124
              - containerPort: 31028
                hostPort: 2128
              - containerPort: 31032
                hostPort: 2132
              - containerPort: 31036
                hostPort: 2136
              - containerPort: 31040
                hostPort: 2140
              - containerPort: 31044
                hostPort: 2144
              - containerPort: 31048
                hostPort: 2148
              - containerPort: 31052
                hostPort: 2152
              - containerPort: 31056
                hostPort: 2156
              - containerPort: 31060
                hostPort: 2160
              - containerPort: 31064
                hostPort: 2164
              - containerPort: 31068
                hostPort: 2168
              - containerPort: 31072
                hostPort: 2172
              - containerPort: 31076
                hostPort: 2176
              - containerPort: 31080
                hostPort: 2180
              - containerPort: 31084
                hostPort: 2184
              - containerPort: 31088
                hostPort: 2188
              - containerPort: 31092
                hostPort: 2192
              - containerPort: 31096
                hostPort: 2196
              - containerPort: 31100
                hostPort: 2200
              - containerPort: 31104
                hostPort: 2204
              - containerPort: 31108
                hostPort: 2208
              - containerPort: 31112
                hostPort: 2212
              - containerPort: 31116
                hostPort: 2216
              - containerPort: 31120
                hostPort: 2220
              - containerPort: 31124
                hostPort: 2224
              - containerPort: 31128
                hostPort: 2228
              - containerPort: 31132
                hostPort: 8001
              - containerPort: 31136
                hostPort: 2232
            extraMounts:
              - hostPath: ${pv_root}
                containerPath: ${pv_root}
        kubeadmConfigPatches:
        - |
          kind: KubeletConfiguration
          localStorageCapacityIsolation: true
        EOF

                                    export KUBECONFIG=${kubeconfig_file}
                                    kubectl cluster-info --context "kind-${kind_name}"

                                    # Configure local registry access on each node using hosts.toml
                                    for node in $(kind get nodes --name "${kind_name}"); do
                                        REGISTRY_DIR="/etc/containerd/certs.d/localhost:${registry_port}"
                                        podman exec "${node}" mkdir -p "${REGISTRY_DIR}"
                                        cat <<EOF | podman exec -i "${node}" cp /dev/stdin "${REGISTRY_DIR}/hosts.toml"
        [host."http://${registry_host}:${registry_port}"]
        EOF
                                    done

                                    podman info
                                    kubectl describe node

                                    for node in $(kind get nodes --name "${kind_name}"); do
                                        kubectl annotate node ${node} tilt.dev/registry=localhost:${registry_port};
                                    done
                                    podman exec -it kind-worker bash -c "sysctl vm.max_map_count"

                                    # Document the local registry
                                    # https://github.com/kubernetes/enhancements/tree/master/keps/sig-cluster-lifecycle/generic/1755-communicating-a-local-registry
                                    cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: local-registry-hosting
          namespace: kube-public
        data:
          localRegistryHosting.v1: |
            host: "localhost:${registry_port}"
            help: "https://kind.sigs.k8s.io/docs/user/local-registry/"
        EOF
    - name: 'Run integration tests: enter stage'
      id: s23
      if: steps.s1.outputs.run == 'true'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Run integration tests: if [ -z "${IT_TEST}" ] && [ "${MAVEN_PROFILE_NAME}" = "integration-tes'
      id: s24
      if: steps.s23.outputs.run == 'true'
      run: |-
        export runtime_path="${WORKSPACE}/bin:${PATH}"
        if [ -z "${IT_TEST}" ] && [ "${MAVEN_PROFILE_NAME}" = "integration-tests" ]; then
           echo 'ERROR: All tests cannot be run with integration-tests profile'
           exit 1
        fi
    - name: 'Run integration tests: Groovy if (manual)'
      id: s25
      if: steps.s23.outputs.run == 'true'
      run: 'echo "::warning::manual migration: Groovy condition at line 552: res != 0 "'
    - name: 'Run integration tests: export PATH=${runtime_path}'
      id: s26
      if: steps.s23.outputs.run == 'true'
      run: "export runtime_path=\"${WORKSPACE}/bin:${PATH}\"\nexport PATH=${runtime_path}\n                            export\
        \ KUBECONFIG=${kubeconfig_file}\n                            mkdir -m777 -p \"${WORKSPACE}/.mvn\"\n              \
        \              : > \"${WORKSPACE}/.mvn/maven.config\"\n                            K8S_NODEPORT_HOST=$(kubectl get\
        \ node kind-worker -o jsonpath='{.status.addresses[?(@.type == \"InternalIP\")].address}')\n                     \
        \       if [ \"${MAVEN_PROFILE_NAME}\" == \"kind-sequential\" ]; then\n                                PARALLEL_RUN='false'\n\
        \                            elif [ \"${MAVEN_PROFILE_NAME}\" == \"kind-upgrade\" ]; then\n                      \
        \          PARALLEL_RUN='false'\n                            fi\n                            if [ -n \"${IT_TEST}\"\
        \ ]; then\n                                echo 'Overriding MAVEN_PROFILE_NAME to integration-test when running individual\
        \ test(s)'\n                                MAVEN_PROFILE_NAME=\"integration-tests\"\n                           \
        \     echo \"-Dit.test=\"${IT_TEST}\"\" >> ${WORKSPACE}/.mvn/maven.config\n                            fi\n      \
        \                      echo \"-Dwko.it.wle.download.url=\"${wle_download_url}\"\"                                \
        \     >> ${WORKSPACE}/.mvn/maven.config\n                            echo \"-Dwko.it.result.root=\"${result_root}\"\
        \"                                               >> ${WORKSPACE}/.mvn/maven.config\n                            echo\
        \ \"-Dwko.it.pv.root=\"${pv_root}\"\"                                                       >> ${WORKSPACE}/.mvn/maven.config\n\
        \                            echo \"-Dwko.it.k8s.nodeport.host=\"${K8S_NODEPORT_HOST}\"\"                        \
        \           >> ${WORKSPACE}/.mvn/maven.config\n                            echo \"-Dwko.it.kind.repo=\"localhost:${registry_port}\"\
        \"                                     >> ${WORKSPACE}/.mvn/maven.config\n                            echo \"-Dwko.it.istio.version=\"\
        ${ISTIO_VERSION}\"\"                                           >> ${WORKSPACE}/.mvn/maven.config\n               \
        \             echo \"-DPARALLEL_CLASSES=\"${PARALLEL_RUN}\"\"                                                >> ${WORKSPACE}/.mvn/maven.config\n\
        \                            echo \"-DNUMBER_OF_THREADS=\"${NUMBER_OF_THREADS}\"\"                               \
        \           >> ${WORKSPACE}/.mvn/maven.config\n                            echo \"-Dwko.it.wdt.download.url=\"${WDT_DOWNLOAD_URL}\"\
        \"                                     >> ${WORKSPACE}/.mvn/maven.config\n                            echo \"-Dwko.it.wit.download.url=\"\
        ${WIT_DOWNLOAD_URL}\"\"                                     >> ${WORKSPACE}/.mvn/maven.config\n                  \
        \          echo \"-Dwko.it.base.images.repo=\"${BASE_IMAGES_REPO}\"\"                                     >> ${WORKSPACE}/.mvn/maven.config\n\
        \                            echo \"-Dwko.it.base.images.tenancy=\"${wko_tenancy}\"\"                            \
        \           >> ${WORKSPACE}/.mvn/maven.config\n                            echo \"-Dwko.it.test.images.repo=\"${TEST_IMAGES_REPO}\"\
        \"                                     >> ${WORKSPACE}/.mvn/maven.config\n                            echo \"-Dwko.it.test.images.tenancy=\"\
        ${wko_tenancy}\"\"                                       >> ${WORKSPACE}/.mvn/maven.config\n                     \
        \       echo \"-Dwko.it.weblogic.image.name=\"${WEBLOGIC_IMAGE_NAME}\"\"                               >> ${WORKSPACE}/.mvn/maven.config\n\
        \                            echo \"-Dwko.it.weblogic.image.tag=\"${WEBLOGIC_IMAGE_TAG}\"\"                      \
        \           >> ${WORKSPACE}/.mvn/maven.config\n                            echo \"-Dwko.it.fmwinfra.image.name=\"\
        ${FMWINFRA_IMAGE_NAME}\"\"                               >> ${WORKSPACE}/.mvn/maven.config\n                     \
        \       echo \"-Dwko.it.fmwinfra.image.tag=\"${FMWINFRA_IMAGE_TAG}\"\"                                 >> ${WORKSPACE}/.mvn/maven.config\n\
        \                            echo \"-Dwko.it.db.image.name=\"${DB_IMAGE_NAME}\"\"                                \
        \           >> ${WORKSPACE}/.mvn/maven.config\n                            echo \"-Dwko.it.db.image.tag=\"${DB_IMAGE_TAG}\"\
        \"                                             >> ${WORKSPACE}/.mvn/maven.config\n                            echo\
        \ \"-Dwko.it.monitoring.exporter.branch=\"${MONITORING_EXPORTER_BRANCH}\"\"                 >> ${WORKSPACE}/.mvn/maven.config\n\
        \                            echo \"-Dwko.it.monitoring.exporter.webapp.version=\"${MONITORING_EXPORTER_WEBAPP_VERSION}\"\
        \" >> ${WORKSPACE}/.mvn/maven.config\n                            echo \"-Dwko.it.prometheus.chart.version=\"${PROMETHEUS_CHART_VERSION}\"\
        \"                     >> ${WORKSPACE}/.mvn/maven.config\n                            echo \"-Dwko.it.grafana.chart.version=\"\
        ${GRAFANA_CHART_VERSION}\"\"                           >> ${WORKSPACE}/.mvn/maven.config\n                       \
        \     echo \"-Dwko.it.collect.logs.on.success=\"${COLLECT_LOGS_ON_SUCCESS}\"\"                       >> ${WORKSPACE}/.mvn/maven.config\n\
        \                            echo \"-DWLSIMG_BUILDER=\"podman\"\"                                                \
        \           >> ${WORKSPACE}/.mvn/maven.config\n                            echo \"-Dwko.it.remoteconsole.version=\"\
        ${REMOTECONSOLE_VERSION}\"\"                           >> ${WORKSPACE}/.mvn/maven.config\n                       \
        \     echo \"-Djdk.httpclient.allowRestrictedHeaders=\"host\"\"                                      >> ${WORKSPACE}/.mvn/maven.config\n\
        \                            echo \"-DOPERATOR_LOG_LEVEL=\"${OPERATOR_LOG_LEVEL}\"\"                             \
        \           >> ${WORKSPACE}/.mvn/maven.config\n\t\t\t    echo \"-Dwko.it.install.weblogic=\"true\"\"             \
        \                                       >> ${WORKSPACE}/.mvn/maven.config\n\n                            echo \"${WORKSPACE}/.mvn/maven.config\
        \ contents:\"\n                            cat \"${WORKSPACE}/.mvn/maven.config\"\n                            cp\
        \ \"${WORKSPACE}/.mvn/maven.config\" \"${result_root}\""
    - name: 'Run integration tests: export PATH="${WORKSPACE}/bin:${PATH}"'
      id: s27
      if: steps.s23.outputs.run == 'true'
      run: |-
        export runtime_path="${WORKSPACE}/bin:${PATH}"
        export PATH="${WORKSPACE}/bin:${PATH}"
        export KUBECONFIG=${kubeconfig_file}
        export BASE_IMAGES_REPO_USERNAME="${OCIR_USER}"
        export BASE_IMAGES_REPO_PASSWORD="${OCIR_PASS}"
        export BASE_IMAGES_REPO_EMAIL="noreply@oracle.com"
        export TEST_IMAGES_REPO_USERNAME="${OCIR_USER}"
        export TEST_IMAGES_REPO_PASSWORD="${OCIR_PASS}"
        export TEST_IMAGES_REPO_EMAIL="noreply@oracle.com"
        mkdir -p integration-tests/target/failsafe-reports "${result_root}/diagnostics/ItLocalTwin" "${result_root}/workdir/liftandshiftworkdir"  # j2gha-local: the directories the stage post archives from
        printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<testsuite name="ItLocalTwin" tests="2" failures="0" errors="0" skipped="0" time="0.2">' '  <testcase name="testOperatorBuilds" classname="ItLocalTwin" time="0.1"/>' '  <testcase name="testHelmChart" classname="ItLocalTwin" time="0.1"/>' '</testsuite>' > integration-tests/target/failsafe-reports/TEST-ItLocalTwin.xml  # j2gha-local: a failsafe report in place of the integration tests (junit + archive read it)
        echo "operator diagnostics for profile ${MAVEN_PROFILE_NAME}" > "${result_root}/diagnostics/ItLocalTwin/operator.log"  # j2gha-local: a diagnostics file for the stage post archive
        echo "lift-and-shift work directory" > "${result_root}/workdir/liftandshiftworkdir/README.txt"  # j2gha-local: a liftandshift file for the stage post archive
        if ! echo mvn -pl integration-tests -P ${MAVEN_PROFILE_NAME} verify 2>&1 | tee "${result_root}/kindtest.log"; then  # j2gha-local: was `time mvn ... verify` (the Kubernetes integration tests, hours); dash has no `time`
            echo "integration-tests failed"
            exit 1
        fi
      env:
        OCIR_USER: j2gha-user
        OCIR_PASS: j2gha-fake-password
    - name: 'Run integration tests: export PATH="${WORKSPACE}/bin:${PATH}"'
      id: s28
      if: (always()) && (steps.s23.outcome == 'success')
      run: |-
        export runtime_path="${WORKSPACE}/bin:${PATH}"
        export PATH="${WORKSPACE}/bin:${PATH}"
        export KUBECONFIG=${kubeconfig_file}
        mkdir -m777 -p ${result_root}/kubelogs
        if ! kind export logs "${result_root}/kubelogs" --name "${kind_name}" --verbosity 99; then
            echo "Failed to export kind logs for kind cluster ${kind_name}"
        fi
        if ! podman exec kind-worker journalctl --utc --dmesg --system > "${result_root}/journalctl-kind-worker.out"; then
            echo "Failed to run journalctl for kind worker"
        fi
        if ! podman exec kind-control-plane journalctl --utc --dmesg --system > "${result_root}/journalctl-kind-control-plane.out"; then
            echo "Failed to run journalctl for kind control plane"
        fi
        if ! journalctl --utc --dmesg --system --since "$start_time" > "${result_root}/journalctl-compute.out"; then
            echo "Failed to run journalctl for compute node"
        fi

        mkdir -m777 -p "${WORKSPACE}/logdir/${BUILD_TAG}/wl_k8s_test_results"
        mv -f ${result_root}/* "${WORKSPACE}/logdir/${BUILD_TAG}/wl_k8s_test_results"  # j2gha-local: no sudo in the harness (the files are the build user's own)
    - name: 'Run integration tests: archive artifacts'
      id: s29
      if: (always()) && (steps.s23.outcome == 'success')
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: artifacts-29
        path: |-
          logdir/${{ env.BUILD_TAG }}/wl_k8s_test_results/diagnostics/**/*
          logdir/${{ env.BUILD_TAG }}/wl_k8s_test_results/workdir/liftandshiftworkdir/**/*
          integration-tests/target/failsafe-reports/*.xml
          !**/.git
          !**/.git/**
          !**/.gitignore
          !**/.gitattributes
          !**/.gitmodules
          !**/.svn
          !**/.svn/**
          !**/.hg
          !**/.hg/**
          !**/.hgignore
          !**/.hgtags
          !**/.bzr
          !**/.bzr/**
          !**/.bzrignore
          !**/CVS
          !**/CVS/**
          !**/.cvsignore
          !**/SCCS
          !**/SCCS/**
          !**/vssver.scc
          !**/.DS_Store
          !**/*~
          !**/#*#
          !**/.#*
          !**/%*%
          !**/._*
          .j2gha-artifact-root
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 1
    - name: 'Run integration tests: junit summary'
      id: s30
      if: ((always()) && (steps.s23.outcome == 'success')) && (always())
      run: |-
        python3 - <<'PY'
        import glob, os, xml.etree.ElementTree as ET
        files = [f for p in os.environ['J2GHA_JUNIT'].splitlines() for f in glob.glob(p, recursive=True)]
        t = f = e = s = 0
        for x in files:
            r = ET.parse(x).getroot()
            for ts in ([r] if r.tag == 'testsuite' else r.iter('testsuite')):
                t += int(ts.get('tests', 0)); f += int(ts.get('failures', 0)); e += int(ts.get('errors', 0)); s += int(ts.get('skipped', 0))
        with open(os.environ.get('GITHUB_STEP_SUMMARY', os.devnull), 'a') as out:
            out.write(f'### JUnit: {t} tests, {f} failures, {e} errors, {s} skipped ({len(files)} files)\n')
        if not files and not True:
            raise SystemExit('no test report files found')
        PY
      env:
        J2GHA_JUNIT: integration-tests/target/failsafe-reports/*.xml
    - name: 'Run integration tests: upload test reports'
      id: s31
      if: ((always()) && (steps.s23.outcome == 'success')) && (always())
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: test-reports-31
        path: integration-tests/target/failsafe-reports/*.xml
        if-no-files-found: ignore
        retention-days: 1
    - name: 'Filter unwanted branches: export PATH="${WORKSPACE}/bin:${PATH}"'
      id: s32
      if: (always()) && (steps.s1.outcome == 'success')
      run: |-
        export PATH="${WORKSPACE}/bin:${PATH}"
        running="$(podman container inspect -f '{{.State.Running}}' "${registry_name}" 2>/dev/null || true)"
        if [ "${running}" = 'true' ]; then
            echo "Stopping the registry container ${registry_name}"
            podman stop "${registry_name}"
            podman rm --force "${registry_name}"
        fi
        echo 'Remove old Kind cluster (if any)...'
        if ! kind delete cluster --name ${kind_name} --kubeconfig "${kubeconfig_file}"; then
            echo "Failed to delete kind cluster ${kind_name}"
        fi
        chown $(whoami) ${WORKSPACE}  # j2gha-local: no sudo in the harness (the workspace is the build user's own)
    - name: 'Sync: enter stage'
      id: s33
      if: ((env.BRANCH_NAME == 'main' || env.BRANCH_NAME == 'release/4.0' || env.BRANCH_NAME == 'release/3.4')) && ((!(github.event_name
        == 'schedule') || (startsWith(env.TAG_NAME, 'v') && !contains(env.TAG_NAME, '/'))))
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Sync: trigger downstream ''wkt-sync'''
      id: s34
      if: steps.s33.outputs.run == 'true'
      run: 'echo "::warning::Downstream Jenkins job ''wkt-sync'' - migrate to a reusable workflow or call: gh workflow run
        <workflow> --ref <ref>"'
