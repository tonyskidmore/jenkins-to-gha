# j2gha selfhosted variant (full) of examples/101
name: j2gha harness run
on:
  push:
    branches:
    - j2gha/run/101-full-selfhosted-20261012141529
  workflow_dispatch:
permissions:
  contents: read
env:
  BRANCH_NAME: main
  TAG_NAME: ''
  CHANGE_ID: ''
  CHANGE_TARGET: ''
  WORKSPACE: ${{ github.workspace }}
  GIT_COMMITTER_NAME: Jenkins User
  GIT_COMMITTER_EMAIL: couchdb@apache.org
  DOCKER_ARGS: -e npm_config_cache=/home/jenkins/.npm -e HOME=. -e MIX_HOME=/home/jenkins/.mix -e HEX_HOME=/home/jenkins/.hex
    -e PIP_CACHE_DIR=/home/jenkins/.cache/pip -v=/etc/passwd:/etc/passwd -v /etc/group:/etc/group -v /home/jenkins/.gradle:/home/jenkins/.gradle:rw,z
    -v /home/jenkins/.hex:/home/jenkins/.hex:rw,z -v /home/jenkins/.npm:/home/jenkins/.npm:rw,z -v /home/jenkins/.cache/pip:/home/jenkins/.cache/pip:rw,z
    -v /home/jenkins/.mix:/home/jenkins/.mix:rw,z
  GIT_COMMIT: d072d90125e39c41b8e4947a89691c6e5ad23c77
  GIT_BRANCH: origin/main
  GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
defaults:
  run:
    shell: bash
jobs:
  setup-env:
    name: Setup Env
    runs-on:
    - self-hosted
    - j2gha-ae0a1e40
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        repository: apache/couchdb
        ref: d072d90125e39c41b8e4947a89691c6e5ad23c77
    - name: 'Setup Env: enter stage'
      id: s1
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Setup Env: Groovy if (manual)'
      id: s2
      if: steps.s1.outputs.run == 'true'
      run: 'echo "::warning::manual migration: Groovy condition at line 418: sh(returnStatus: true, script: docs_changed)
        == 0 "'
    - name: 'Setup Env: Groovy if (manual)'
      id: s3
      if: steps.s1.outputs.run == 'true'
      run: 'echo "::warning::manual migration: Groovy condition at line 424: sh(returnStatus: true, script: github_changed)
        == 0 "'
    - name: 'Setup Env: ${J2GHA_TODO_wscleanup__}'
      id: s4
      if: (always()) && (steps.s1.outcome == 'success')
      run: ${J2GHA_TODO_wscleanup__}
  build-docs:
    name: Build Docs
    needs: setup-env
    runs-on:
    - self-hosted
    - j2gha-ae0a1e40
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        repository: apache/couchdb
        ref: d072d90125e39c41b8e4947a89691c6e5ad23c77
    - name: 'Build Docs: enter stage'
      id: s5
      if: env.ONLY_DOCS_CHANGED == '1'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Build Docs: make python-black'
      id: s6
      if: steps.s5.outputs.run == 'true'
      run: make python-black
    - name: 'Build Docs: (cd src/docs && ./setup.sh ; make check)'
      id: s7
      if: steps.s5.outputs.run == 'true'
      run: (cd src/docs && ./setup.sh  ; make check)
    - name: 'Build Docs: (cd src/docs && make html)'
      id: s8
      if: steps.s5.outputs.run == 'true'
      run: (cd src/docs && make html)
    - name: 'Build Docs: ${J2GHA_TODO_wscleanup__}'
      id: s9
      if: (always()) && (steps.s5.outcome == 'success')
      run: ${J2GHA_TODO_wscleanup__}
  build-release-tarball:
    name: Build Release Tarball
    needs: build-docs
    runs-on:
    - self-hosted
    - j2gha-ae0a1e40
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        repository: apache/couchdb
        ref: d072d90125e39c41b8e4947a89691c6e5ad23c77
    - name: 'Build Release Tarball: enter stage'
      id: s10
      if: env.ONLY_DOCS_CHANGED == '0' && env.ONLY_GITHUB_CHANGED == '0'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Build Release Tarball: Clean workspace of any previous release artifacts'
      id: s11
      if: steps.s10.outputs.run == 'true'
      run: rm -rf apache-couchdb-*
    - name: 'Build Release Tarball: echo "skipped: ./configure --spidermonkey-version 128 --with-nouveau"'
      id: s12
      if: steps.s10.outputs.run == 'true'
      run: 'echo "skipped: ./configure --spidermonkey-version 128 --with-nouveau"'
    - name: 'Build Release Tarball: echo "skipped: make erlfmt-check"'
      id: s13
      if: steps.s10.outputs.run == 'true'
      run: 'echo "skipped: make erlfmt-check"'
    - name: 'Build Release Tarball: echo "skipped: make elixir-source-checks"'
      id: s14
      if: steps.s10.outputs.run == 'true'
      run: 'echo "skipped: make elixir-source-checks"'
    - name: 'Build Release Tarball: echo "skipped: make python-black"'
      id: s15
      if: steps.s10.outputs.run == 'true'
      run: 'echo "skipped: make python-black"'
    - name: 'Build Release Tarball: # j2gha-local: was `make -j4 --output-sync=target dist` (needs Erlang,'
      id: s16
      if: steps.s10.outputs.run == 'true'
      run: |-
        # j2gha-local: was `make -j4 --output-sync=target dist` (needs Erlang, rebar, Elixir and Sphinx). Builds a
                  # stand-in release tarball named as the real dist target names it from version.mk (the tarball-build form,
                  # without the git sha suffix, so both sides archive the same name). Its configure and Makefile stand in for
                  # CouchDB's: the Test and Package stage runs its configure/make/junit/package commands against them unchanged.
                  . ./version.mk
                  rel="apache-couchdb-${vsn_major}.${vsn_minor}.${vsn_patch}"
                  rm -rf "$rel" && mkdir -p "$rel"
                  cp LICENSE NOTICE version.mk "$rel/"
                  printf '%s
        ' '#!/bin/sh' 'echo "configure (j2gha-local stand-in): $*"' > "$rel/configure"
                  chmod +x "$rel/configure"
                  printf '%s
        ' "<testsuite name='couch_tests' tests='2' failures='0' errors='0'>"             "<testcase classname='couch_tests' name='basic'/>" "<testcase classname='couch_tests' name='config'/>"             '</testsuite>' > "$rel/eunit-report.xml"
                  printf '%s
        ' '.RECIPEPREFIX := >'             'all xref elixir elixir-search mango-test weatherreport-test nouveau-test quickjs-test262 build-report:'             '>@echo "make $@ (j2gha-local stand-in)"'             'eunit:'             '>mkdir -p .eunit && cp eunit-report.xml .eunit/couch_tests.xml' > "$rel/Makefile"
                  tar czf "$rel.tar.gz" "$rel" && rm -rf "$rel"
                  echo "Done: $rel.tar.gz"
    - name: 'Build Release Tarball: ls -l ${WORKSPACE}'
      id: s17
      if: (always()) && (steps.s10.outcome == 'success') && ((steps.s11.outcome == 'failure' || steps.s12.outcome == 'failure'
        || steps.s13.outcome == 'failure' || steps.s14.outcome == 'failure' || steps.s15.outcome == 'failure' || steps.s16.outcome
        == 'failure'))
      run: ls -l ${WORKSPACE}
    - name: 'Build Release Tarball: stash tarball'
      id: s18
      if: (!cancelled()) && (steps.s10.outcome == 'success') && (!(steps.s11.outcome == 'failure' || steps.s12.outcome ==
        'failure' || steps.s13.outcome == 'failure' || steps.s14.outcome == 'failure' || steps.s15.outcome == 'failure' ||
        steps.s16.outcome == 'failure' || steps.s17.outcome == 'failure'))
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: stash-tarball
        path: |-
          apache-couchdb-*.tar.gz
          !**/.git
          !**/.git/**
          !**/.gitignore
          !**/.gitattributes
          !**/.gitmodules
          !**/.svn
          !**/.svn/**
          !**/.hg
          !**/.hg/**
          !**/.hgignore
          !**/.hgtags
          !**/.bzr
          !**/.bzr/**
          !**/.bzrignore
          !**/CVS
          !**/CVS/**
          !**/.cvsignore
          !**/SCCS
          !**/SCCS/**
          !**/vssver.scc
          !**/.DS_Store
          !**/*~
          !**/#*#
          !**/.#*
          !**/%*%
          !**/._*
        retention-days: 1
        include-hidden-files: true
        if-no-files-found: error
    - name: 'Build Release Tarball: archive artifacts'
      id: s19
      if: (!cancelled()) && (steps.s10.outcome == 'success') && (!(steps.s11.outcome == 'failure' || steps.s12.outcome ==
        'failure' || steps.s13.outcome == 'failure' || steps.s14.outcome == 'failure' || steps.s15.outcome == 'failure' ||
        steps.s16.outcome == 'failure' || steps.s17.outcome == 'failure'))
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: artifacts-19
        path: |-
          apache-couchdb-*.tar.gz
          !**/.git
          !**/.git/**
          !**/.gitignore
          !**/.gitattributes
          !**/.gitmodules
          !**/.svn
          !**/.svn/**
          !**/.hg
          !**/.hg/**
          !**/.hgignore
          !**/.hgtags
          !**/.bzr
          !**/.bzr/**
          !**/.bzrignore
          !**/CVS
          !**/CVS/**
          !**/.cvsignore
          !**/SCCS
          !**/SCCS/**
          !**/vssver.scc
          !**/.DS_Store
          !**/*~
          !**/#*#
          !**/.#*
          !**/%*%
          !**/._*
          .j2gha-artifact-root
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 1
    - name: 'Build Release Tarball: ${J2GHA_TODO_wscleanup__}'
      id: s20
      if: (always()) && (steps.s10.outcome == 'success')
      run: ${J2GHA_TODO_wscleanup__}
  test-and-package:
    name: Test and Package
    needs: build-release-tarball
    runs-on:
    - self-hosted
    - j2gha-ae0a1e40
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        repository: apache/couchdb
        ref: d072d90125e39c41b8e4947a89691c6e5ad23c77
    - name: 'Test and Package: enter stage'
      id: s21
      if: env.ONLY_DOCS_CHANGED == '0' && env.ONLY_GITHUB_CHANGED == '0'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
