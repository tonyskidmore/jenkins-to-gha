# j2gha act variant (full) of examples/015
name: 'j2gha 015: IBM/cloudant-node-sdk Jenkinsfile (j2gha)'
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
env:
  BRANCH_NAME: main
  TAG_NAME: ''
  CHANGE_ID: ''
  BUILD_NUMBER: ${{ github.run_number }}
  JOB_NAME: ex-015-full
  GIT_COMMIT: e775c33e2de8b8245290200c3e36e52208b09521
  TARGET_VERSION: ${{ github.event_name != 'workflow_dispatch' && 'NONE' || format('{0}', inputs.TARGET_VERSION) }}
  ARTIFACTORY_CREDS: j2gha-fake-secret
  ARTIFACTORY_URL_UP: 'TODO-j2gha: ${Artifactory.server(''taas-artifactory-upload'').getUrl()}'
  ARTIFACTORY_URL_DOWN: 'TODO-j2gha: ${Artifactory.server(''taas-artifactory'').getUrl()}'
  CHANGE_BRANCH: ''
  GIT_BRANCH: origin/main
  GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
defaults:
  run:
    shell: bash
jobs:
  detect-secrets:
    name: Detect Secrets, Init, QA, SonarQube analysis, Publish[staging], Run Gauge tests, Mend scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: 'Detect Secrets: detectSecrets (manual migration)'
      id: s1
      run: echo "::warning::Jenkins step 'detectSecrets' requires manual migration"
    - name: 'Init: set libName'
      id: s2
      run: |-
        libName="node"
        { echo 'libName<<J2GHA_EOF'; printf '%s\n' "$libName"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'libName<<J2GHA_EOF'; printf '%s\n' "$libName"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'QA: enter stage'
      id: s3
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'QA: ./scripts/setup_couch.sh'
      id: s4
      if: steps.s3.outputs.run == 'true'
      run: ./scripts/setup_couch.sh
      env:
        DOCKER_HOST: ''
        SERVER_AUTH_TYPE: basic
        SERVER_URL: http://127.0.0.1:5984
        WIREMOCK_URL: http://127.0.0.1:8080
        WIREMOCK_PORT: '8080'
        SERVER_USERNAME: j2gha-user
        SERVER_PASSWORD: j2gha-fake-password
    - name: 'QA: ./scripts/setup_wiremock.sh'
      id: s5
      if: steps.s3.outputs.run == 'true'
      run: ./scripts/setup_wiremock.sh
      env:
        DOCKER_HOST: ''
        SERVER_AUTH_TYPE: basic
        SERVER_URL: http://127.0.0.1:5984
        WIREMOCK_URL: http://127.0.0.1:8080
        WIREMOCK_PORT: '8080'
        SERVER_USERNAME: j2gha-user
        SERVER_PASSWORD: j2gha-fake-password
    - name: 'QA: npm ci --no-audit'
      id: s6
      if: steps.s3.outputs.run == 'true'
      run: |-
        export NPMRC_EMAIL="${NPMRC_USER}"
        export NPMRC_REGISTRY="${J2GHA_TODO_noScheme_____}"
        export NPM_CONFIG_REGISTRY="${registryArtifactoryDown}"
        npm ci --no-audit
      env:
        DOCKER_HOST: ''
        SERVER_AUTH_TYPE: basic
        SERVER_URL: http://127.0.0.1:5984
        WIREMOCK_URL: http://127.0.0.1:8080
        WIREMOCK_PORT: '8080'
        SERVER_USERNAME: j2gha-user
        SERVER_PASSWORD: j2gha-fake-password
        NPMRC_USER: j2gha-user
        NPMRC_TOKEN: j2gha-fake-password
        NPM_CONFIG_USERCONFIG: .npmrc-jenkins
    - name: 'QA: npm test'
      id: s7
      if: steps.s3.outputs.run == 'true'
      run: |-
        export NPMRC_EMAIL="${NPMRC_USER}"
        export NPMRC_REGISTRY="${J2GHA_TODO_noScheme_____}"
        export NPM_CONFIG_REGISTRY="${registryArtifactoryDown}"
        npm test
      env:
        DOCKER_HOST: ''
        SERVER_AUTH_TYPE: basic
        SERVER_URL: http://127.0.0.1:5984
        WIREMOCK_URL: http://127.0.0.1:8080
        WIREMOCK_PORT: '8080'
        SERVER_USERNAME: j2gha-user
        SERVER_PASSWORD: j2gha-fake-password
        NPMRC_USER: j2gha-user
        NPMRC_TOKEN: j2gha-fake-password
        NPM_CONFIG_USERCONFIG: .npmrc-jenkins
    - name: 'QA: junit summary'
      id: s8
      if: ((always()) && (steps.s3.outcome == 'success')) && (always())
      run: |-
        python3 - <<'PY'
        import glob, os, xml.etree.ElementTree as ET
        files = [f for p in os.environ['J2GHA_JUNIT'].splitlines() for f in glob.glob(p, recursive=True)]
        t = f = e = s = 0
        for x in files:
            r = ET.parse(x).getroot()
            for ts in ([r] if r.tag == 'testsuite' else r.iter('testsuite')):
                t += int(ts.get('tests', 0)); f += int(ts.get('failures', 0)); e += int(ts.get('errors', 0)); s += int(ts.get('skipped', 0))
        with open(os.environ.get('GITHUB_STEP_SUMMARY', os.devnull), 'a') as out:
            out.write(f'### JUnit: {t} tests, {f} failures, {e} errors, {s} skipped ({len(files)} files)\n')
        if not files and not False:
            raise SystemExit('no test report files found')
        PY
      env:
        J2GHA_JUNIT: '**/junitreports/*.xml'
    - name: 'QA: upload test reports'
      id: s9
      if: ((always()) && (steps.s3.outcome == 'success')) && (always())
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: test-reports-9
        path: '**/junitreports/*.xml'
        if-no-files-found: warn
    - name: 'SonarQube analysis: enter stage'
      id: s10
      if: ((env.CHANGE_ID != '' || env.BRANCH_IS_PRIMARY != '')) && (!(((env.CHANGE_ID != '' && ((startsWith(env.CHANGE_BRANCH,
        'dependabot') && !contains(env.CHANGE_BRANCH, '/')))) && !((env.CHANGE_ID != '' && (vars.J2GHA_WHEN_L82 == 'true'))))))
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'SonarQube analysis: stage environment'
      id: s11
      if: steps.s10.outputs.run == 'true'
      run: 'true'
    - name: 'SonarQube analysis: scanCode (manual migration)'
      id: s12
      if: steps.s10.outputs.run == 'true'
      run: echo "::warning::Jenkins step 'scanCode' requires manual migration"
      env:
        scannerHome: 'TODO-j2gha: tool()'
    - name: 'Publish[staging]: enter stage'
      id: s13
      if: '!(env.TAG_NAME != '''')'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Publish[staging]: bumpVersion (manual migration)'
      id: s14
      if: steps.s13.outputs.run == 'true'
      run: echo "::warning::Jenkins step 'bumpVersion' requires manual migration"
    - name: 'Publish[staging]: customizePublishingInfo (manual migration)'
      id: s15
      if: steps.s13.outputs.run == 'true'
      run: echo "::warning::Jenkins step 'customizePublishingInfo' requires manual migration"
    - name: 'Publish[staging]: npm run build'
      id: s16
      if: steps.s13.outputs.run == 'true'
      run: |-
        export STAGE_ROOT="${ARTIFACTORY_URL_UP}/api/"
        export LIB_NAME="${libName}"
        export TYPE="${buildType}"
        export ARTIFACT_URL="${artifactUrl}"
        export MODULE_ID="${moduleId}"
        export BUILD_NAME="${JOB_NAME}"
        export NPMRC_EMAIL="${NPMRC_USER}"
        export NPMRC_REGISTRY="${J2GHA_TODO_noScheme_____}"
        export NPM_CONFIG_REGISTRY="${registryArtifactoryUp}"
        npm run build
      env:
        NPMRC_USER: j2gha-user
        NPMRC_TOKEN: j2gha-fake-password
        NPM_CONFIG_USERCONFIG: .npmrc-jenkins
    - name: 'Publish[staging]: npm publish --tag ${tag} ./dist'
      id: s17
      if: steps.s13.outputs.run == 'true'
      run: |-
        export STAGE_ROOT="${ARTIFACTORY_URL_UP}/api/"
        export LIB_NAME="${libName}"
        export TYPE="${buildType}"
        export ARTIFACT_URL="${artifactUrl}"
        export MODULE_ID="${moduleId}"
        export BUILD_NAME="${JOB_NAME}"
        export NPMRC_EMAIL="${NPMRC_USER}"
        export NPMRC_REGISTRY="${J2GHA_TODO_noScheme_____}"
        export NPM_CONFIG_REGISTRY="${registryArtifactoryUp}"
        npm publish --tag ${tag} ./dist
      env:
        NPMRC_USER: j2gha-user
        NPMRC_TOKEN: j2gha-fake-password
        NPM_CONFIG_USERCONFIG: .npmrc-jenkins
    - name: 'Publish[staging]: publishArtifactoryBuildInfo (manual migration)'
      id: s18
      if: steps.s13.outputs.run == 'true'
      run: echo "::warning::Jenkins step 'publishArtifactoryBuildInfo' requires manual migration"
    - name: 'Publish[staging]: git reset --hard'
      id: s19
      if: (always()) && (steps.s13.outcome == 'success')
      run: |-
        export STAGE_ROOT="${ARTIFACTORY_URL_UP}/api/"
        git reset --hard
    - name: 'Run Gauge tests: enter stage'
      id: s20
      if: '!(env.TAG_NAME != '''')'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Run Gauge tests: set gaugeBranchName'
      id: s21
      if: steps.s20.outputs.run == 'true'
      run: |-
        gaugeBranchName="${BRANCH_NAME}"
        { echo 'gaugeBranchName<<J2GHA_EOF'; printf '%s\n' "$gaugeBranchName"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'gaugeBranchName<<J2GHA_EOF'; printf '%s\n' "$gaugeBranchName"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Run Gauge tests: if (line 138)'
      id: s22
      if: (steps.s20.outputs.run == 'true') && (env.TAG_NAME != '' || env.BRANCH_IS_PRIMARY != '')
      run: echo "taken=true" >> "$GITHUB_OUTPUT"
    - name: 'Run Gauge tests: if (line 138)'
      id: s23
      if: (steps.s20.outputs.run == 'true') && (steps.s22.outcome == 'skipped')
      run: echo "taken=false" >> "$GITHUB_OUTPUT"
    - name: 'Run Gauge tests: set gaugeBranchName'
      id: s24
      if: (steps.s20.outputs.run == 'true') && (steps.s22.outputs.taken == 'true')
      run: |-
        gaugeBranchName="${TARGET_GAUGE_RELEASE_BRANCH_NAME}"
        { echo 'gaugeBranchName<<J2GHA_EOF'; printf '%s\n' "$gaugeBranchName"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'gaugeBranchName<<J2GHA_EOF'; printf '%s\n' "$gaugeBranchName"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Run Gauge tests: try (line 142)'
      id: s25
      if: steps.s20.outputs.run == 'true'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Run Gauge tests: trigger downstream ''/${env.SDKS_GAUGE_PIPELINE_PROJECT}/${gaugeBranchName}'''
      id: s26
      if: steps.s20.outputs.run == 'true'
      run: 'echo "::warning::Downstream Jenkins job ''/\${env.SDKS_GAUGE_PIPELINE_PROJECT}/\${gaugeBranchName}'' - migrate
        to a reusable workflow or call: gh workflow run <workflow> --ref <ref>"'
    - name: 'Run Gauge tests: Groovy if (manual)'
      id: s27
      if: (always()) && (steps.s25.outcome == 'success') && ((steps.s26.outcome == 'failure'))
      run: 'echo "::warning::manual migration: Groovy condition at line 148: ae.getMessage().contains(\"No item named /\${env.SDKS_GAUGE_PIPELINE_PROJECT}/\${gaugeBranchName}
        found"'
    - name: 'Mend scan: enter stage'
      id: s28
      if: env.BRANCH_IS_PRIMARY != ''
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Mend scan: mendScan (manual migration)'
      id: s29
      if: steps.s28.outputs.run == 'true'
      run: echo "::warning::Jenkins step 'mendScan' requires manual migration"
    - name: 'Update version and tag: enter stage'
      id: s30
      if: (env.BRANCH_NAME == 'main' && !((env.TARGET_VERSION) == ('NONE')))
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Update version and tag: gitsh (manual migration)'
      id: s33
      if: steps.s30.outputs.run == 'true'
      run: echo "::warning::Jenkins step 'gitsh' requires manual migration"
    - name: 'Update version and tag: bumpVersion (manual migration)'
      id: s31
      if: steps.s30.outputs.run == 'true'
      run: echo "::warning::Jenkins step 'bumpVersion' requires manual migration"
    - name: 'Update version and tag: git push --tags origin HEAD:main'
      id: s32
      if: steps.s30.outputs.run == 'true'
      run: git push --tags origin HEAD:main
    - name: 'Publish[repository]: enter stage'
      id: s34
      if: (env.TAG_NAME != '' && (vars.J2GHA_WHEN_L200 == 'true'))
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Publish[repository]: npm run build'
      id: s35
      if: steps.s34.outputs.run == 'true'
      run: |-
        export NPMRC_REGISTRY="${J2GHA_TODO_noScheme_____}"
        export NPM_CONFIG_REGISTRY="${registryPublic}"
        npm run build
      env:
        NPMRC_EMAIL: j2gha-fake-secret
        NPMRC_USER: j2gha-user
        NPMRC_TOKEN: j2gha-fake-password
        NPM_CONFIG_USERCONFIG: .npmrc-jenkins
    - name: 'Publish[repository]: npm publish --tag latest ./dist'
      id: s36
      if: steps.s34.outputs.run == 'true'
      run: |-
        export NPMRC_REGISTRY="${J2GHA_TODO_noScheme_____}"
        export NPM_CONFIG_REGISTRY="${registryPublic}"
        npm publish --tag latest ./dist
      env:
        NPMRC_EMAIL: j2gha-fake-secret
        NPMRC_USER: j2gha-user
        NPMRC_TOKEN: j2gha-fake-password
        NPM_CONFIG_USERCONFIG: .npmrc-jenkins
    - name: 'Publish[repository]: gitsh (manual migration)'
      id: s38
      if: steps.s34.outputs.run == 'true'
      run: echo "::warning::Jenkins step 'gitsh' requires manual migration"
    - name: 'Publish[repository]: ./scripts/typedoc/publish-doc.sh'
      id: s37
      if: steps.s34.outputs.run == 'true'
      run: ./scripts/typedoc/publish-doc.sh
