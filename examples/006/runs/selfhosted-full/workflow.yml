# j2gha selfhosted variant (full) of examples/006
name: j2gha harness run
on:
  push:
    branches:
    - j2gha/run/006-full-selfhosted-20261012084848
  workflow_dispatch:
permissions:
  contents: read
env:
  BRANCH_NAME: master
  TAG_NAME: ''
  CHANGE_ID: ''
  BUILD_NUMBER: ${{ github.run_number }}
  JOB_NAME: ${{ github.workflow }}
  BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  GIT_COMMIT: ee4cfb0dfbbce20115f98cb2be4d486747549b59
  GIT_BRANCH: origin/master
  GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
defaults:
  run:
    shell: bash
jobs:
  setup:
    name: Setup, Build, Publish, DEV Deploy, PRE Deploy
    runs-on:
    - self-hosted
    - j2gha-30f3d246
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        repository: fabiojose/platform-as-code-example
        ref: ee4cfb0dfbbce20115f98cb2be4d486747549b59
    - name: 'Setup: set target'
      id: s1
      run: |-
        j2gha_re1='^((.+)feature-(.+))$'
        j2gha_re2='^((.+)release-(.+))$'
        if [[ "${GIT_BRANCH}" == 'origin/develop' || "${GIT_BRANCH}" =~ $j2gha_re1 ]]; then
          target=dev
        elif [[ "${GIT_BRANCH}" =~ $j2gha_re2 ]]; then
          target=pre
        elif [[ "${GIT_BRANCH}" == 'origin/master' ]]; then
          target=pro
        else
          echo "::error::Unknown branch type: ${GIT_BRANCH}"
          exit 1
        fi
        echo "target=${target:-}" >> "$GITHUB_ENV"
        echo "target=${target:-}" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Setup: jq -r ''.variable.iac_version.default'' src/package.tf'
      id: s2
      run: jq -r '.variable.iac_version.default' src/package.tf
    - name: 'Build: sed -i ''s/iac-provider/terraform/g'' src/variables.tf'
      id: s3
      run: sed -i 's/iac-provider/terraform/g' src/variables.tf
    - name: 'Build: sed -i ''s/iac-artifact/${packname}/g'' src/variables.tf'
      id: s4
      run: sed -i 's/iac-artifact/${packname}/g' src/variables.tf
    - name: 'Build: sed -i ''s/iac-scm-commit/${GIT_COMMIT}/g'' src/variables.tf'
      id: s5
      run: sed -i 's/iac-scm-commit/${GIT_COMMIT}/g' src/variables.tf
    - name: 'Build: sed -i ''s|iac-scm-branch|${GIT_BRANCH}|g'' src/variables.tf'
      id: s6
      run: sed -i 's|iac-scm-branch|${GIT_BRANCH}|g' src/variables.tf
    - name: 'Build: sed -i ''s/iac-build-by/jenkins/g'' src/variables.tf'
      id: s7
      run: sed -i 's/iac-build-by/jenkins/g' src/variables.tf
    - name: 'Build: sed -i ''s/iac-build-name/${JOB_NAME}/g'' src/variables.tf'
      id: s8
      run: sed -i 's/iac-build-name/${JOB_NAME}/g' src/variables.tf
    - name: 'Build: sed -i ''s/iac-build-id/${BUILD_NUMBER}/g'' src/variables.tf'
      id: s9
      run: sed -i 's/iac-build-id/${BUILD_NUMBER}/g' src/variables.tf
    - name: 'Build: sed -i ''s/iac-build-date/${J2GHA_TODO_currentBuild_startTimeInMillis}/'
      id: s10
      run: sed -i 's/iac-build-date/${J2GHA_TODO_currentBuild_startTimeInMillis}/g' src/variables.tf
    - name: 'Build: sed -i ''s/${oversion}/${version}/g'' src/package.tf'
      id: s11
      run: sed -i 's/${oversion}/${version}/g' src/package.tf
    - name: 'Build: tar --exclude=''./.git'' --exclude=''./Jenkinsfile'' --exclude=''*.tar.gz'''
      id: s12
      run: tar --exclude='./.git' --exclude='./Jenkinsfile' --exclude='*.tar.gz' -czv ./src -f ${packname}
    - name: 'Publish: curl -u $NEXUS_USERNAME:$NEXUS_PASSWORD --upload-file ${packname} ${pu'
      id: s13
      run: curl -u $NEXUS_USERNAME:$NEXUS_PASSWORD --upload-file ${packname} ${publish_url}
      env:
        NEXUS_USERNAME: j2gha-user
        NEXUS_PASSWORD: j2gha-fake-password
    - name: 'DEV Deploy: bash $FOLLOW "artifact" "${publish_url}" "29cd3a68-e101-4176-907c-6fdf'
      id: s14
      run: bash $FOLLOW "artifact" "${publish_url}" "29cd3a68-e101-4176-907c-6fdf5bde13e7"
      env:
        RUNDECK_USERNAME: j2gha-user
        RUNDECK_PASSWORD: j2gha-fake-password
    - name: 'PRE Deploy: enter stage'
      id: s15
      if: env.target == 'pre' || env.target == 'pro'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'PRE Deploy: bash $FOLLOW "artifact" "${publish_url}" "ec0393b9-f0eb-4341-8812-eae2'
      id: s16
      if: steps.s15.outputs.run == 'true'
      run: bash $FOLLOW "artifact" "${publish_url}" "ec0393b9-f0eb-4341-8812-eae241ef6544"
      env:
        RUNDECK_USERNAME: j2gha-user
        RUNDECK_PASSWORD: j2gha-fake-password
    - name: Hand on the pipeline workspace (archive)
      if: always()
      shell: bash
      run: |
        tar --exclude=./.j2gha-ws --exclude=./.j2gha-ws.tgz --exclude=./.j2gha-ws.changes \
          -czf "$RUNNER_TEMP/j2gha-ws.tgz" -C "$GITHUB_WORKSPACE" .
        mv "$RUNNER_TEMP/j2gha-ws.tgz" "$GITHUB_WORKSPACE/.j2gha-ws.tgz"
    - name: Hand on the pipeline workspace (upload)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: j2gha-ws-setup
        path: .j2gha-ws.tgz
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
        include-hidden-files: true
    outputs:
      target: ${{ steps.s1.outputs.target }}
  acceptance-test:
    name: Acceptance Test
    needs: setup
    runs-on:
    - self-hosted
    - j2gha-30f3d246
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        repository: fabiojose/platform-as-code-example
        ref: ee4cfb0dfbbce20115f98cb2be4d486747549b59
    - name: 'Acceptance Test: enter stage'
      id: s17
      if: env.target == 'pro'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Acceptance Test: cd test && npm install'
      id: s18
      if: steps.s17.outputs.run == 'true'
      run: cd test && npm install
    - name: 'Acceptance Test: cd test && npm test'
      id: s19
      if: steps.s17.outputs.run == 'true'
      run: cd test && npm test
    - name: 'Acceptance Test: cucumber (manual migration)'
      id: s20
      if: steps.s17.outputs.run == 'true'
      run: echo "::warning::Jenkins step 'cucumber' requires manual migration"
    env:
      target: ${{ needs.setup.outputs.target }}
  approval:
    name: Approval, PRO Deploy
    needs:
    - acceptance-test
    - setup
    runs-on:
    - self-hosted
    - j2gha-30f3d246
    timeout-minutes: 10
    steps:
    - name: Restore pipeline workspace (setup)
      id: j2gha-ws-setup
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      continue-on-error: true
      with:
        name: j2gha-ws-setup
        path: .j2gha-ws/setup
    - name: Restore pipeline workspace (merge)
      id: j2gha-ws-restore
      if: always()
      shell: bash
      env:
        J2GHA_WS_ORDER: setup
        J2GHA_WS_LINEAGE: 'setup:'
        J2GHA_WS_HEADS: setup
        J2GHA_WS_RESULTS: ''
        J2GHA_WS_FALLBACKS: 'setup:'
      run: |
        ws="$GITHUB_WORKSPACE"
        d="$ws/.j2gha-ws"
        # the downloaded producers a producer descends from
        ancestors() {
          local line
          while IFS= read -r line; do
            if [ "${line%%:*}" = "$1" ]; then printf '%s\n' "${line#*:}"; fi
          done <<< "$J2GHA_WS_LINEAGE"
        }
        present() { [ -f "$d/$1/.j2gha-ws.tgz" ]; }
        # read-only directories (a Go module cache) need write permission to be removed
        remove() { rm -rf -- "$@" 2>/dev/null || { chmod -R u+w -- "$@"; rm -rf -- "$@"; }; }
        isdir() { [ -d "$1" ] && [ ! -L "$1" ]; }
        # replay a branch's own changes (its change list) onto the workspace
        replay() {
          local src="$d/$1" t="$d/.replay" rec p a
          local -a recs=() gone=()
          local -A want=() locked=() removed=()
          if [ ! -f "$src/.j2gha-ws.changes" ]; then
            echo "::error::the workspace of job '$1' has no change list (the workspace it started from was not recorded): it cannot be merged"
            exit 1
          fi
          mapfile -t recs < "$src/.j2gha-ws.changes"
          for rec in "${recs[@]}"; do
            printf -v p '%b' "${rec:1}"
            if [ "${rec:0:1}" = D ]; then
              removed[$p]=1
              continue
            fi
            want[$p]=1
            # a parent directory an earlier branch removed or replaced is taken from this branch too
            a=$p
            while a=${a%/*}; [ "$a" != . ]; do
              if isdir "$ws/$a"; then break; fi
              want[$a]=1
            done
          done
          # a removed directory takes its contents with it: only the top-most removed entries are removed
          for p in "${!removed[@]}"; do
            a=$p
            while a=${a%/*}; [ "$a" != . ] && [ -z "${removed[$a]-}" ]; do :; done
            if [ "$a" = . ]; then gone+=("$p"); fi
          done
          # only the entries to copy come out of the branch's workspace (parents first)
          mkdir -p "$t"
          printf '%s\0' "${!want[@]}" | LC_ALL=C sort -z > "$d/.want"
          if [ "${#want[@]}" -gt 0 ]; then tar -xzpf "$src/.j2gha-ws.tgz" -C "$t" --null --no-unquote --no-recursion -T "$d/.want"; fi
          # read-only directories (a Go module cache) are opened for the changes; their modes are put back afterwards
          for p in "${gone[@]}" "${!want[@]}"; do
            a=${p%/*}
            if [ "$a" != . ] && isdir "$ws/$a" && [ ! -w "$ws/$a" ] && [ -z "${locked[$a]-}" ]; then
              locked[$a]=$(stat -c %a "$ws/$a")
              chmod u+w "$ws/$a"
            fi
          done
          for p in "${gone[@]}"; do remove "$ws/$p"; done
          # clear what is in the way of an entry's type: a file or link where the branch has a directory, or the reverse
          for p in "${!want[@]}"; do
            if isdir "$t/$p"; then
              if [ -L "$ws/$p" ] || { [ -e "$ws/$p" ] && [ ! -d "$ws/$p" ]; }; then rm -f -- "$ws/$p"; fi
              if isdir "$ws/$p" && [ ! -w "$ws/$p" ]; then chmod u+w "$ws/$p"; fi  # tar sets the branch's mode
            elif isdir "$ws/$p"; then
              remove "$ws/$p"
            fi
          done
          if [ "${#want[@]}" -gt 0 ]; then
            # tar sets directory modes after their contents
            tar -C "$t" --null --no-unquote --no-recursion -T "$d/.want" -cf - | tar -xpf - -C "$ws"
          fi
          for a in "${!locked[@]}"; do
            if [ -z "${want[$a]-}" ] && isdir "$ws/$a"; then chmod "${locked[$a]}" "$ws/$a"; fi
          done
          remove "$t"
        }
        # every producer the restore relies on is accounted for: its workspace arrived, or its job was skipped and the
        # producers it would have started from are accounted for in turn (the fallback chain actually used)
        declare -A result=() fallback=() seen=()
        for r in $J2GHA_WS_RESULTS; do result[${r%%=*}]=${r#*=}; done
        while IFS= read -r line; do
          if [ -n "$line" ]; then fallback[${line%%:*}]=${line#*:}; fi
        done <<< "$J2GHA_WS_FALLBACKS"
        account() {
          local p=$1 f
          if [ -n "${seen[$p]-}" ] || present "$p"; then return 0; fi
          seen[$p]=1
          case "${result[$p]-}" in
            success|failure)
              echo "::error::job '$p' ran (${result[$p]}) but its workspace did not arrive: restoring an older one would lose its changes"
              exit 1 ;;
            skipped|cancelled) ;;
            *) echo "::warning::the workspace of job '$p' did not arrive and its result is not known here (not a job this one needs): taken as skipped - if it ran, its changes are missing" ;;
          esac
          for f in ${fallback[$p]-}; do account "$f"; done
        }
        for p in $J2GHA_WS_HEADS; do account "$p"; done
        # the workspaces to merge: those downloaded that no other downloaded one descends from
        frontier=()
        for p in $J2GHA_WS_ORDER; do
          present "$p" || continue
          covered=false
          for q in $J2GHA_WS_ORDER; do
            if [ "$q" != "$p" ] && present "$q"; then
              case " $(ancestors "$q") " in *" $p "*) covered=true ;; esac
            fi
          done
          if [ "$covered" = false ]; then frontier+=("$p"); fi
        done
        restored=false
        if [ "${#frontier[@]}" -gt 0 ]; then
          # the restored workspace replaces what the job started with (act copies the repository into every job)
          shopt -s dotglob nullglob
          for e in "$ws"/*; do
            if [ "$e" != "$d" ]; then remove "$e"; fi
          done
          shopt -u dotglob nullglob
          tar -xzpf "$d/${frontier[0]}/.j2gha-ws.tgz" -C "$ws"
          for f in "${frontier[@]:1}"; do replay "$f"; done
          restored=true
        fi
        remove "$d"
        echo "restored=$restored" >> "$GITHUB_OUTPUT"
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        repository: fabiojose/platform-as-code-example
        ref: ee4cfb0dfbbce20115f98cb2be4d486747549b59
      if: steps.j2gha-ws-restore.outputs.restored != 'true'
    - name: 'Approval: enter stage'
      id: s21
      if: env.target == 'pro'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Approval: input'
      id: s22
      if: steps.s21.outputs.run == 'true'
      run: 'echo "::notice::Manual approval point: Deploy to Production? (use a protected environment)"'
      timeout-minutes: 30
    - name: 'PRO Deploy: enter stage'
      id: s23
      if: env.target == 'pro'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'PRO Deploy: bash $FOLLOW "artifact" "${publish_url}" "f31fb4bb-4f55-4f23-9c03-7840'
      id: s24
      if: steps.s23.outputs.run == 'true'
      run: bash $FOLLOW "artifact" "${publish_url}" "f31fb4bb-4f55-4f23-9c03-784008acb5c4"
      env:
        RUNDECK_USERNAME: j2gha-user
        RUNDECK_PASSWORD: j2gha-fake-password
    - name: Hand on the pipeline workspace (archive)
      if: always()
      shell: bash
      run: |
        tar --exclude=./.j2gha-ws --exclude=./.j2gha-ws.tgz --exclude=./.j2gha-ws.changes \
          -czf "$RUNNER_TEMP/j2gha-ws.tgz" -C "$GITHUB_WORKSPACE" .
        mv "$RUNNER_TEMP/j2gha-ws.tgz" "$GITHUB_WORKSPACE/.j2gha-ws.tgz"
    - name: Hand on the pipeline workspace (upload)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: j2gha-ws-approval
        path: .j2gha-ws.tgz
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
        include-hidden-files: true
    env:
      target: ${{ needs.setup.outputs.target }}
  post:
    name: post
    needs:
    - setup
    - acceptance-test
    - approval
    if: always()
    runs-on:
    - self-hosted
    - j2gha-30f3d246
    steps:
    - name: Restore pipeline workspace (approval)
      id: j2gha-ws-approval
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      continue-on-error: true
      with:
        name: j2gha-ws-approval
        path: .j2gha-ws/approval
    - name: Restore pipeline workspace (setup)
      id: j2gha-ws-setup
      if: (steps.j2gha-ws-approval.outcome != 'success')
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      continue-on-error: true
      with:
        name: j2gha-ws-setup
        path: .j2gha-ws/setup
    - name: Restore pipeline workspace (merge)
      id: j2gha-ws-restore
      if: always()
      shell: bash
      env:
        J2GHA_WS_ORDER: setup approval
        J2GHA_WS_LINEAGE: |-
          setup:
          approval: setup
        J2GHA_WS_HEADS: approval
        J2GHA_WS_RESULTS: setup=${{ needs.setup.result }} approval=${{ needs.approval.result }}
        J2GHA_WS_FALLBACKS: |-
          setup:
          approval: setup
      run: |
        ws="$GITHUB_WORKSPACE"
        d="$ws/.j2gha-ws"
        # the downloaded producers a producer descends from
        ancestors() {
          local line
          while IFS= read -r line; do
            if [ "${line%%:*}" = "$1" ]; then printf '%s\n' "${line#*:}"; fi
          done <<< "$J2GHA_WS_LINEAGE"
        }
        present() { [ -f "$d/$1/.j2gha-ws.tgz" ]; }
        # read-only directories (a Go module cache) need write permission to be removed
        remove() { rm -rf -- "$@" 2>/dev/null || { chmod -R u+w -- "$@"; rm -rf -- "$@"; }; }
        isdir() { [ -d "$1" ] && [ ! -L "$1" ]; }
        # replay a branch's own changes (its change list) onto the workspace
        replay() {
          local src="$d/$1" t="$d/.replay" rec p a
          local -a recs=() gone=()
          local -A want=() locked=() removed=()
