# j2gha act variant (full) of examples/018
name: 'j2gha 018: dvsa/olcs-ci pipelines/app_release_package/Jenkinsfile (j2gha)'
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
env:
  BRANCH_NAME: master
  TAG_NAME: ''
  CHANGE_ID: ''
  GIT_COMMIT: e7e9913a6090bd18f16fb85eb98b7b5f0dbfa87c
