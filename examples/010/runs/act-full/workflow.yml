# j2gha act variant (full) of examples/010
name: 'j2gha 010: apicollective/apibuilder Jenkinsfile (j2gha)'
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
env:
  BRANCH_NAME: main
  TAG_NAME: ''
  CHANGE_ID: ''
  GIT_COMMIT: 11b4b94e5fe33581d3d7de46c4002dbffcb3afc6
  GIT_BRANCH: origin/main
  GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
defaults:
  run:
    shell: bash
jobs:
  main:
    name: main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: ': set sbtOnMain'
      id: s1
      run: |-
        sbtOnMain="no"
        { echo 'sbtOnMain<<J2GHA_EOF'; printf '%s\n' "$sbtOnMain"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'sbtOnMain<<J2GHA_EOF'; printf '%s\n' "$sbtOnMain"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set podLabel'
      id: s2
      run: |-
        podLabel="Jenkinsfile-apibuilder"
        { echo 'podLabel<<J2GHA_EOF'; printf '%s\n' "$podLabel"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'podLabel<<J2GHA_EOF'; printf '%s\n' "$podLabel"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: podTemplate (manual migration)
      id: s14
      run: echo "::warning::Jenkins step 'podTemplate' requires manual migration"
    - name: try (line 14)
      id: s3
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: checkoutWithTags (manual migration)
      id: s4
      run: echo "::warning::Jenkins step 'checkoutWithTags' requires manual migration"
    - name: 'Checkout: echo'
      id: s5
      run: 'echo "Checking out branch: ${BRANCH_NAME}"'
    - name: 'Checkout: checkout'
      id: s6
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: 'tagging: taggingv2 (manual migration)'
      id: s7
      run: echo "::warning::Jenkins step 'taggingv2' requires manual migration"
    - name: checkoutWithTags (manual migration)
      id: s8
      run: echo "::warning::Jenkins step 'checkoutWithTags' requires manual migration"
    - name: ': set jsondata'
      id: s9
      run: |-
        jsondata="
              [{\"serviceName\": \"apibuilder-api\",
              \"dockerImageName\": \"apibuilder-api\",
              \"dockerFilePath\" : \"/api/Dockerfile\",
              \"multiplatforms\": \"no\"},
              {\"serviceName\": \"apibuilder-app\",
              \"dockerImageName\": \"apibuilder-app\",
              \"dockerFilePath\" : \"/app/Dockerfile\",
              \"multiplatforms\": \"no\"}]
              "
        { echo 'jsondata<<J2GHA_EOF'; printf '%s\n' "$jsondata"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'jsondata<<J2GHA_EOF'; printf '%s\n' "$jsondata"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: mainJenkinsBuildArgo (manual migration)
      id: s10
      run: echo "::warning::Jenkins step 'mainJenkinsBuildArgo' requires manual migration"
      env:
        ARGOCD_AUTH_TOKEN: j2gha-fake-secret
    - name: ': Groovy throw (manual)'
      id: s11
      if: (always()) && (steps.s3.outcome == 'success') && ((steps.s4.outcome == 'failure' || steps.s5.outcome == 'failure'
        || steps.s6.outcome == 'failure' || steps.s7.outcome == 'failure' || steps.s8.outcome == 'failure' || steps.s9.outcome
        == 'failure' || steps.s10.outcome == 'failure'))
      run: 'echo "::warning::manual migration: Groovy throw at line 63"'
    - name: cleanWs
      id: s12
      if: (always()) && (steps.s3.outcome == 'success')
      run: find . -mindepth 1 -delete || true
    - name: echo
      id: s13
      if: (always()) && (steps.s3.outcome == 'success')
      run: echo "Pipeline execution finished"
