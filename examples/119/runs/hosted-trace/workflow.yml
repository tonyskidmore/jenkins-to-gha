# j2gha hosted variant (trace) of examples/119
name: j2gha harness run
on:
  push:
    branches:
    - j2gha/run/119-trace-hosted-20261012155359
  workflow_dispatch:
permissions:
  contents: read
env:
  BRANCH_NAME: master
  TAG_NAME: ''
  CHANGE_ID: ''
  GIT_BRANCH: origin/master
  WORKSPACE: ${{ github.workspace }}
  GIT_COMMIT: ${{ github.sha }}
  GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
  TARGET_LOCATION: j2gha-stub
  GIT_REPO_URL: j2gha-stub
  PLUGIN: j2gha-stub
  BUCKET: j2gha-stub
  IPA_FILE_NAME: j2gha-stub
  INTEGRATION_TEST_CHECK: j2gha-stub
defaults:
  run:
    shell: bash
jobs:
  main:
    name: main, Git Checkout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: deleteDir
      id: s14
      run: printf '%s %s\n' J2GHA-TRACE '{"stage":"","step":"deleteDir"}'
    - name: stash ${target_location}
      id: s23
      run: printf '%s %s\n' J2GHA-TRACE '{"stage":"","step":"stash"}'
    outputs:
      target_location: ${{ steps.s6.outputs.target_location }}
  main-2:
    name: main, NPM Install, Security Check, SonarQube, Unit Tests, NPM Build, Cordova Platform
    needs: main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: deleteDir
      id: s25
      run: printf '%s %s\n' J2GHA-TRACE '{"stage":"","step":"deleteDir"}'
    - name: unstash ${target_location}
      id: s28
      run: printf '%s %s\n' J2GHA-TRACE '{"stage":"","step":"unstash"}'
    - name: stash build
      id: s62
      run: printf '%s %s\n' J2GHA-TRACE '{"stage":"","step":"stash"}'
    env:
      target_location: ${{ needs.main.outputs.target_location }}
  main-3:
    name: main, Upload to S3, Generate bucket URL
    needs: main-2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: deleteDir
      id: s65
      run: printf '%s %s\n' J2GHA-TRACE '{"stage":"","step":"deleteDir"}'
    - name: unstash build
      id: s66
      run: printf '%s %s\n' J2GHA-TRACE '{"stage":"","step":"unstash"}'
