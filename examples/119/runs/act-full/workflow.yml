# j2gha act variant (full) of examples/119
name: 'j2gha 119: dvsa/dvsa-mobile-pipeline ops/mobile_build.groovy (j2gha)'
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
env:
  BRANCH_NAME: master
  TAG_NAME: ''
  CHANGE_ID: ''
  GIT_BRANCH: origin/master
  WORKSPACE: ${{ github.workspace }}
  GIT_COMMIT: 1827396f6752465cf0a91a3bcf2ea4bb021c2d3d
  GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
  TARGET_LOCATION: j2gha-stub
  GIT_REPO_URL: j2gha-stub
  PLUGIN: j2gha-stub
  BUCKET: j2gha-stub
  IPA_FILE_NAME: j2gha-stub
  INTEGRATION_TEST_CHECK: j2gha-stub
defaults:
  run:
    shell: bash
jobs:
  main:
    name: main, Git Checkout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: new Globals (manual migration)
      id: s1
      run: echo "::warning::Jenkins step 'new Globals' requires manual migration"
    - name: new CommonFunctions (manual migration)
      id: s2
      run: echo "::warning::Jenkins step 'new CommonFunctions' requires manual migration"
    - name: new MobileCoreFunctions (manual migration)
      id: s3
      run: echo "::warning::Jenkins step 'new MobileCoreFunctions' requires manual migration"
    - name: new GitFunctions (manual migration)
      id: s4
      run: echo "::warning::Jenkins step 'new GitFunctions' requires manual migration"
    - name: ': set branch'
      id: s5
      run: |-
        branch="${GIT_BRANCH}"
        { echo 'branch<<J2GHA_EOF'; printf '%s\n' "$branch"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'branch<<J2GHA_EOF'; printf '%s\n' "$branch"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set target_location'
      id: s6
      run: |-
        target_location="${TARGET_LOCATION}"
        { echo 'target_location<<J2GHA_EOF'; printf '%s\n' "$target_location"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'target_location<<J2GHA_EOF'; printf '%s\n' "$target_location"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set git_repo_url'
      id: s7
      run: |-
        git_repo_url="${GIT_REPO_URL}"
        { echo 'git_repo_url<<J2GHA_EOF'; printf '%s\n' "$git_repo_url"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'git_repo_url<<J2GHA_EOF'; printf '%s\n' "$git_repo_url"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set plugin_check'
      id: s8
      run: |-
        plugin_check="${PLUGIN}"
        { echo 'plugin_check<<J2GHA_EOF'; printf '%s\n' "$plugin_check"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'plugin_check<<J2GHA_EOF'; printf '%s\n' "$plugin_check"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': Groovy if (manual)'
      id: s9
      run: 'echo "::warning::manual migration: Groovy condition at line 18: plugin_check.toString() == ''Yes''"'
    - name: ': set bucket'
      id: s10
      run: |-
        bucket="${BUCKET}"
        { echo 'bucket<<J2GHA_EOF'; printf '%s\n' "$bucket"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'bucket<<J2GHA_EOF'; printf '%s\n' "$bucket"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set file'
      id: s11
      run: |-
        file="${IPA_FILE_NAME}"
        { echo 'file<<J2GHA_EOF'; printf '%s\n' "$file"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'file<<J2GHA_EOF'; printf '%s\n' "$file"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set integration_test_check'
      id: s12
      run: |-
        integration_test_check="${INTEGRATION_TEST_CHECK}"
        { echo 'integration_test_check<<J2GHA_EOF'; printf '%s\n' "$integration_test_check"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'integration_test_check<<J2GHA_EOF'; printf '%s\n' "$integration_test_check"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': Groovy if (manual)'
      id: s13
      run: 'echo "::warning::manual migration: Groovy condition at line 28: integration_test_check.toString() == ''Yes''"'
    - name: deleteDir
      id: s14
      run: find . -mindepth 1 -delete || true
    - name: 'Git Checkout: log (manual migration)'
      id: s15
      run: echo "::warning::Jenkins step 'log' requires manual migration"
    - name: 'Git Checkout: git_check_out (manual migration)'
      id: s16
      run: echo "::warning::Jenkins step 'git_check_out' requires manual migration"
    - name: 'Git Checkout: Groovy if (manual)'
      id: s17
      run: 'echo "::warning::manual migration: Groovy condition at line 53: plugin_check == ''Yes''"'
    - name: 'Git Checkout: Groovy if (manual)'
      id: s18
      run: 'echo "::warning::manual migration: Groovy condition at line 59: plugin_check == ''Yes''"'
    - name: 'Git Checkout: log (manual migration)'
      id: s19
      run: echo "::warning::Jenkins step 'log' requires manual migration"
    - name: pwd (manual migration)
      id: s20
      run: echo "::warning::Jenkins step 'pwd' requires manual migration"
    - name: dir
      id: s21
      run: mkdir -p -- "$J2GHA_DIR"
      env:
        J2GHA_DIR: ${{ env.WORKSPACE }}
    - name: log (manual migration)
      id: s22
      run: echo "::warning::Jenkins step 'log' requires manual migration"
      working-directory: ${{ env.WORKSPACE }}
    - name: stash ${target_location}
      id: s23
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: stash-${{ env.target_location }}
        path: ${{ env.WORKSPACE }}/${{ env.target_location }}/**
        retention-days: 1
        include-hidden-files: true
        if-no-files-found: ignore
    - name: log (manual migration)
      id: s24
      run: echo "::warning::Jenkins step 'log' requires manual migration"
      working-directory: ${{ env.WORKSPACE }}
    outputs:
      target_location: ${{ steps.s6.outputs.target_location }}
  main-3:
    name: main, Upload to S3, Generate bucket URL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: deleteDir
      id: s65
      run: find . -mindepth 1 -delete || true
    - name: unstash build
      id: s66
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: stash-build
        merge-multiple: true
        path: build
    - name: 'Upload to S3: log (manual migration)'
      id: s67
      run: echo "::warning::Jenkins step 'log' requires manual migration"
    - name: 'Upload to S3: upload (manual migration)'
      id: s68
      run: echo "::warning::Jenkins step 'upload' requires manual migration"
    - name: 'Upload to S3: log (manual migration)'
      id: s69
      run: echo "::warning::Jenkins step 'log' requires manual migration"
    - name: 'Generate bucket URL: log (manual migration)'
      id: s70
      run: echo "::warning::Jenkins step 'log' requires manual migration"
    - name: 'Generate bucket URL: publish (manual migration)'
      id: s71
      run: echo "::warning::Jenkins step 'publish' requires manual migration"
    - name: 'Generate bucket URL: log (manual migration)'
      id: s72
      run: echo "::warning::Jenkins step 'log' requires manual migration"
