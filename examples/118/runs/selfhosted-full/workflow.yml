# j2gha selfhosted variant (full) of examples/118
name: j2gha harness run
on:
  push:
    branches:
    - j2gha/run/118-full-selfhosted-20261012232721
  workflow_dispatch:
permissions:
  contents: read
env:
  BRANCH_NAME: master
  TAG_NAME: ''
  CHANGE_ID: ''
  WORKSPACE: ${{ github.workspace }}
  DRYRUN: ${{ github.event_name != 'workflow_dispatch' && 'false' || format('{0}', inputs.DRYRUN) }}
  VERSION: ${{ github.event_name != 'workflow_dispatch' && '1.0.0' || format('{0}', inputs.VERSION) }}
  olcs_transxchange_version: ${{ github.event_name != 'workflow_dispatch' && '2.0.0' || format('{0}', inputs.olcs_transxchange_version)
    }}
  olcs_auth_version: ${{ github.event_name != 'workflow_dispatch' && '3.0.0' || format('{0}', inputs.olcs_auth_version) }}
  GIT_COMMIT: e7e9913a6090bd18f16fb85eb98b7b5f0dbfa87c
  GIT_BRANCH: origin/master
  GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
defaults:
  run:
    shell: bash
jobs:
  main:
    name: main, App Branch Close and Tag (not currently integrated), Get Repos, Get App Release Tags
    runs-on:
    - self-hosted
    - j2gha-9ab72bca
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        repository: dvsa/olcs-ci
        ref: e7e9913a6090bd18f16fb85eb98b7b5f0dbfa87c
    - name: ': set defaultS3Bucket'
      id: s1
      run: |-
        defaultS3Bucket="devapp-olcs-pri-olcs-deploy-s3/"
        { echo 'defaultS3Bucket<<J2GHA_EOF'; printf '%s\n' "$defaultS3Bucket"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'defaultS3Bucket<<J2GHA_EOF'; printf '%s\n' "$defaultS3Bucket"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set templateS3Bucket'
      id: s2
      run: |-
        templateS3Bucket="devapp-shd-pri-file-deploy-s3/"
        { echo 'templateS3Bucket<<J2GHA_EOF'; printf '%s\n' "$templateS3Bucket"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'templateS3Bucket<<J2GHA_EOF'; printf '%s\n' "$templateS3Bucket"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set ldifLabel'
      id: s3
      run: |-
        ldifLabel="olcs-dir-ldif-version"
        { echo 'ldifLabel<<J2GHA_EOF'; printf '%s\n' "$ldifLabel"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'ldifLabel<<J2GHA_EOF'; printf '%s\n' "$ldifLabel"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set txcLabel'
      id: s4
      run: |-
        txcLabel="olcs-transxchange-version"
        { echo 'txcLabel<<J2GHA_EOF'; printf '%s\n' "$txcLabel"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'txcLabel<<J2GHA_EOF'; printf '%s\n' "$txcLabel"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set txcFile'
      id: s5
      run: |-
        txcFile="txc"
        { echo 'txcFile<<J2GHA_EOF'; printf '%s\n' "$txcFile"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'txcFile<<J2GHA_EOF'; printf '%s\n' "$txcFile"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set authLabel'
      id: s6
      run: |-
        authLabel="olcs_auth_version"
        { echo 'authLabel<<J2GHA_EOF'; printf '%s\n' "$authLabel"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'authLabel<<J2GHA_EOF'; printf '%s\n' "$authLabel"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set authFile'
      id: s7
      run: |-
        authFile="openam"
        { echo 'authFile<<J2GHA_EOF'; printf '%s\n' "$authFile"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'authFile<<J2GHA_EOF'; printf '%s\n' "$authFile"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set appVersionFile'
      id: s8
      run: |-
        appVersionFile=""
        { echo 'appVersionFile<<J2GHA_EOF'; printf '%s\n' "$appVersionFile"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'appVersionFile<<J2GHA_EOF'; printf '%s\n' "$appVersionFile"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set stageName'
      id: s9
      run: |-
        stageName="App Branch Close and Tag (not currently integrated)"
        { echo 'stageName<<J2GHA_EOF'; printf '%s\n' "$stageName"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'stageName<<J2GHA_EOF'; printf '%s\n' "$stageName"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set stageName'
      id: s10
      run: |-
        stageName="Get Repos"
        { echo 'stageName<<J2GHA_EOF'; printf '%s\n' "$stageName"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'stageName<<J2GHA_EOF'; printf '%s\n' "$stageName"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Get Repos: deleteDir'
      id: s11
      run: find . -mindepth 1 -delete || true
    - name: 'Get Repos: Groovy for (manual)'
      id: s12
      run: 'echo "::warning::manual migration: Groovy for at line 63"'
    - name: ': set stageName'
      id: s13
      run: |-
        stageName="Get App Release Tags"
        { echo 'stageName<<J2GHA_EOF'; printf '%s\n' "$stageName"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'stageName<<J2GHA_EOF'; printf '%s\n' "$stageName"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Get App Release Tags: Groovy for (manual)'
      id: s14
      run: 'echo "::warning::manual migration: Groovy for at line 83"'
    - name: 'Get App Release Tags: dir olcs-api-version'
      id: s15
      run: mkdir -p -- "$J2GHA_DIR"
      env:
        J2GHA_DIR: olcs-api-version
    - name: 'Get App Release Tags: git describe --abbrev=0 --tags `git rev-list --tags --skip=1 --max-cou'
      id: s16
      run: git describe --abbrev=0 --tags `git rev-list --tags --skip=1 --max-count=1` > result
      working-directory: olcs-api-version
    - name: 'Get App Release Tags: readFile (manual migration)'
      id: s17
      run: echo "::warning::Jenkins step 'readFile' requires manual migration"
      working-directory: olcs-api-version
    - name: 'Get App Release Tags: set appVersionFile'
      id: s18
      run: |-
        appVersionFile="${txcLabel} : '${olcs_transxchange_version}'
        "
        { echo 'appVersionFile<<J2GHA_EOF'; printf '%s\n' "$appVersionFile"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'appVersionFile<<J2GHA_EOF'; printf '%s\n' "$appVersionFile"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Get App Release Tags: set appVersionFile'
      id: s19
      run: |-
        appVersionFile="${authLabel} : '${olcs_auth_version}'
        "
        { echo 'appVersionFile<<J2GHA_EOF'; printf '%s\n' "$appVersionFile"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'appVersionFile<<J2GHA_EOF'; printf '%s\n' "$appVersionFile"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: ': set stageName'
      id: s20
      run: |-
        stageName="Check and Build Release Artefacts"
        { echo 'stageName<<J2GHA_EOF'; printf '%s\n' "$stageName"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'stageName<<J2GHA_EOF'; printf '%s\n' "$stageName"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Check and Build Release Artefacts: set message'
      id: s21
      run: |-
        message=""
        { echo 'message<<J2GHA_EOF'; printf '%s\n' "$message"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'message<<J2GHA_EOF'; printf '%s\n' "$message"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Check and Build Release Artefacts: Groovy for (manual)'
      id: s22
      run: 'echo "::warning::manual migration: Groovy for at line 120"'
    - name: ': set stageName'
      id: s23
      run: |-
        stageName="Check Artefacts from Input Params"
        { echo 'stageName<<J2GHA_EOF'; printf '%s\n' "$stageName"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'stageName<<J2GHA_EOF'; printf '%s\n' "$stageName"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Check Artefacts from Input Params: set message'
      id: s24
      run: |-
        message=""
        { echo 'message<<J2GHA_EOF'; printf '%s\n' "$message"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'message<<J2GHA_EOF'; printf '%s\n' "$message"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Check Artefacts from Input Params: set cmd'
      id: s25
      run: |-
        cmd="echo \"2018-03-29 13:20      1024   s3://${defaultS3Bucket}openam/${authFile}-${olcs_auth_version}.tar.gz\" > result"
        { echo 'cmd<<J2GHA_EOF'; printf '%s\n' "$cmd"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'cmd<<J2GHA_EOF'; printf '%s\n' "$cmd"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Check Artefacts from Input Params: ${cmd}'
      id: s26
      run: ${cmd}
    - name: 'Check Artefacts from Input Params: set cmd2'
      id: s27
      run: |-
        cmd2="grep ${authFile}-${olcs_auth_version}.tar.gz result > result2 || true"
        { echo 'cmd2<<J2GHA_EOF'; printf '%s\n' "$cmd2"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'cmd2<<J2GHA_EOF'; printf '%s\n' "$cmd2"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Check Artefacts from Input Params: ${cmd2}'
      id: s28
      run: ${cmd2}
    - name: 'Check Artefacts from Input Params: readFile (manual migration)'
      id: s29
      run: echo "::warning::Jenkins step 'readFile' requires manual migration"
    - name: 'Check Artefacts from Input Params: Groovy if (manual)'
      id: s30
      run: 'echo "::warning::manual migration: Groovy condition at line 162: file.contains(authFile + ''-'' + params.olcs_auth_version)"'
    - name: 'Check Artefacts from Input Params: set cmd3'
      id: s31
      run: |-
        cmd3="echo \"2018-03-29 13:20      1024   s3://${defaultS3Bucket}api/${txcFile}-${olcs_transxchange_version}.war\" > result"
        { echo 'cmd3<<J2GHA_EOF'; printf '%s\n' "$cmd3"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'cmd3<<J2GHA_EOF'; printf '%s\n' "$cmd3"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Check Artefacts from Input Params: ${cmd3}'
      id: s32
      run: ${cmd3}
    - name: 'Check Artefacts from Input Params: set cmd4'
      id: s33
      run: |-
        cmd4="grep ${txcFile}-${olcs_transxchange_version}.war result > result2 || true"
        { echo 'cmd4<<J2GHA_EOF'; printf '%s\n' "$cmd4"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'cmd4<<J2GHA_EOF'; printf '%s\n' "$cmd4"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Check Artefacts from Input Params: ${cmd4}'
      id: s34
      run: ${cmd4}
    - name: 'Check Artefacts from Input Params: readFile (manual migration)'
      id: s35
      run: echo "::warning::Jenkins step 'readFile' requires manual migration"
    - name: 'Check Artefacts from Input Params: Groovy if (manual)'
      id: s36
      run: 'echo "::warning::manual migration: Groovy condition at line 181: file2.contains(txcFile + ''-'' + params.olcs_transxchange_version)"'
    - name: ': set stageName'
      id: s37
      run: |-
        stageName="Check App Version against Built artefacts"
        { echo 'stageName<<J2GHA_EOF'; printf '%s\n' "$stageName"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'stageName<<J2GHA_EOF'; printf '%s\n' "$stageName"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Check App Version against Built artefacts: if (line 197)'
      id: s38
      if: env.DRYRUN == 'true'
      run: echo "taken=true" >> "$GITHUB_OUTPUT"
    - name: 'Check App Version against Built artefacts: if (line 197)'
      id: s39
      if: steps.s38.outcome == 'skipped'
      run: echo "taken=false" >> "$GITHUB_OUTPUT"
    - name: 'Check App Version against Built artefacts: trigger downstream ''Check App Release Tags'''
      id: s40
      if: steps.s39.outputs.taken == 'false'
      run: 'echo "::warning::Downstream Jenkins job ''Check App Release Tags'' - migrate to a reusable workflow or call: gh
        workflow run <workflow> --ref <ref>"'
    - name: ': set stageName'
      id: s41
      run: |-
        stageName="Create and Push Release Manifest"
        { echo 'stageName<<J2GHA_EOF'; printf '%s\n' "$stageName"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'stageName<<J2GHA_EOF'; printf '%s\n' "$stageName"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 'Create and Push Release Manifest: if (line 211)'
      id: s42
      if: env.DRYRUN == 'true'
      run: echo "taken=true" >> "$GITHUB_OUTPUT"
    - name: 'Create and Push Release Manifest: if (line 211)'
      id: s43
      if: steps.s42.outcome == 'skipped'
      run: echo "taken=false" >> "$GITHUB_OUTPUT"
    - name: 'Create and Push Release Manifest: dir app-version'
      id: s44
      if: steps.s43.outputs.taken == 'false'
      run: mkdir -p -- "$J2GHA_DIR"
      env:
        J2GHA_DIR: app-version
    - name: 'Create and Push Release Manifest: deleteDir'
      id: s45
      if: steps.s43.outputs.taken == 'false'
      run: find . -mindepth 1 -delete || true
      working-directory: app-version
    - name: 'Create and Push Release Manifest: git init -q -b develop ${WORKSPACE}/.gitlab/aws/app-version.git && cd'
      id: s46
      if: steps.s43.outputs.taken == 'false'
      run: git init -q -b develop ${WORKSPACE}/.gitlab/aws/app-version.git && cd ${WORKSPACE}/.gitlab/aws/app-version.git
        && mkdir hiera && touch hiera/app_version.eyaml && git add hiera && git -c user.name=j2gha -c user.email=j2gha@localhost
        commit -q -m develop
      working-directory: app-version
    - name: 'Create and Push Release Manifest: checkout'
      id: s47
      if: steps.s43.outputs.taken == 'false'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        path: app-version
        repository: dvsa/olcs-ci
        ref: e7e9913a6090bd18f16fb85eb98b7b5f0dbfa87c
    - name: 'Create and Push Release Manifest: ls -lrt'
      id: s48
      if: steps.s43.outputs.taken == 'false'
      run: ls -lrt
      working-directory: app-version
    - name: 'Create and Push Release Manifest: git checkout -b release-candidate'
      id: s49
      if: steps.s43.outputs.taken == 'false'
      run: git checkout -b release-candidate
      working-directory: app-version
    - name: 'Create and Push Release Manifest: writeFile hiera/app_version.eyaml'
      id: s50
      if: steps.s43.outputs.taken == 'false'
      run: |-
        J2GHA_W="$(cat <<J2GHA_EOF
        ${appVersionFile}
        J2GHA_EOF
        printf x)"; J2GHA_W=${J2GHA_W%x}; printf '%s' "${J2GHA_W%$'\n'}" > hiera/app_version.eyaml
      working-directory: app-version
    - name: 'Create and Push Release Manifest: git status'
      id: s51
      if: steps.s43.outputs.taken == 'false'
      run: git status
      working-directory: app-version
    - name: 'Create and Push Release Manifest: git add hiera/app_version.eyaml'
      id: s52
      if: steps.s43.outputs.taken == 'false'
      run: git add hiera/app_version.eyaml
      working-directory: app-version
    - name: 'Create and Push Release Manifest: git -c user.name=j2gha -c user.email=j2gha@localhost commit -m "Releas'
      id: s53
      if: steps.s43.outputs.taken == 'false'
      run: git -c user.name=j2gha -c user.email=j2gha@localhost commit -m "Release ${VERSION}"
      working-directory: app-version
    - name: 'Create and Push Release Manifest: git push --set-upstream origin release-candidate'
      id: s54
      if: steps.s43.outputs.taken == 'false'
      run: git push --set-upstream origin release-candidate
      working-directory: app-version
