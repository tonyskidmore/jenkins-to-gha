# j2gha hosted variant (trace) of examples/108
name: j2gha harness run
on:
  push:
    branches:
    - j2gha/run/108-trace-hosted-20261012082557
  workflow_dispatch:
permissions:
  contents: read
env:
  BRANCH_NAME: master
  TAG_NAME: ''
  CHANGE_ID: ''
  forceBuild: ${{ github.event_name != 'workflow_dispatch' && 'false' || format('{0}', inputs.forceBuild) }}
  publish: ${{ github.event_name != 'workflow_dispatch' && 'false' || format('{0}', inputs.publish) }}
  h2oBranch: ${{ github.event_name != 'workflow_dispatch' && 'master' || format('{0}', inputs.h2oBranch) }}
  noCache: ${{ github.event_name != 'workflow_dispatch' && 'true' || format('{0}', inputs.noCache) }}
  GIT_COMMIT: ${{ github.sha }}
  GIT_BRANCH: origin/master
  GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
defaults:
  run:
    shell: bash
jobs:
  main:
    name: main, Checkout and Init
    runs-on: ubuntu-latest
    timeout-minutes: 5
