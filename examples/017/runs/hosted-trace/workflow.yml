# j2gha hosted variant (trace) of examples/017
name: j2gha harness run
on:
  push:
    branches:
    - j2gha/run/017-trace-hosted-20261012212643
  workflow_dispatch:
permissions:
  contents: read
env:
  BRANCH_NAME: master
  TAG_NAME: ''
  CHANGE_ID: ''
  BUILD_NUMBER: '12'
  JOB_NAME: ex-017-trace
  BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  WORKSPACE: ${{ github.workspace }}
  GIT_COMMIT: ${{ github.sha }}
  GIT_BRANCH: origin/master
  GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
  APP_BRANCH: j2gha-stub
  TF_BRANCH: j2gha-stub
  ACTION: j2gha-stub
  ENVIRONMENT: j2gha-stub
  CLEAN_WORKSPACE: j2gha-stub
  SELENIUM_HUB_ADDRESS: j2gha-stub
  SKIP_TESTS: j2gha-stub
  FORCE_RELOAD_DATA: j2gha-stub
defaults:
  run:
    shell: bash
jobs:
  init:
    name: Init
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      run: printf '%s %s\n' J2GHA-TRACE '{"stage":"Init","step":"checkout"}'
    - name: 'Init: Check DB data completion: enter stage'
      id: s1
      if: env.action == 'apply'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Init: Check DB data completion: if (line 180)'
      id: s2
      if: (steps.s1.outputs.run == 'true') && (env.force_reload_data == 'true')
      run: echo "taken=true" >> "$GITHUB_OUTPUT"
    - name: 'Init: Check DB data completion: if (line 180)'
      id: s3
      if: (steps.s1.outputs.run == 'true') && (steps.s2.outcome == 'skipped')
      run: echo "taken=false" >> "$GITHUB_OUTPUT"
    - name: 'Init: TF deployment bucket: date +%Y%m%d%H%M%S'
      id: s12
      run: 'printf ''%s %s\n'' J2GHA-TRACE ''{"stage":"Init: TF deployment bucket","step":"sh"}'''
    - name: 'Init: Verify environment: enter stage'
      id: s17
      if: env.action != 'destroy'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
  build-build-cvr-frontend:
    name: 'Build / Build: CVR frontend'
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: 'Build: enter stage'
      id: s34
      if: env.action == 'apply'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: Checkout
      if: steps.s34.outputs.run == 'true'
      run: 'printf ''%s %s\n'' J2GHA-TRACE ''{"stage":"Build: CVR frontend","step":"checkout"}'''
    - name: 'Build: CVR frontend: enter stage'
      id: s35
      if: (steps.s34.outputs.run == 'true') && (vars.J2GHA_WHEN_L318 == 'true')
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Build: CVR frontend: deleteDir'
      id: s37
      if: steps.s35.outputs.run == 'true'
      run: 'printf ''%s %s\n'' J2GHA-TRACE ''{"stage":"Build: CVR frontend","step":"deleteDir"}'''
  build-build-cvr-backend:
    name: 'Build / Build: CVR backend'
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: 'Build: enter stage'
      id: s44
      if: env.action == 'apply'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: Checkout
      if: steps.s44.outputs.run == 'true'
      run: 'printf ''%s %s\n'' J2GHA-TRACE ''{"stage":"Build: CVR backend","step":"checkout"}'''
    - name: 'Build: CVR backend: enter stage'
      id: s45
      if: (steps.s44.outputs.run == 'true') && (vars.J2GHA_WHEN_L351 == 'true')
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Build: CVR backend: deleteDir'
      id: s47
      if: steps.s45.outputs.run == 'true'
      run: 'printf ''%s %s\n'' J2GHA-TRACE ''{"stage":"Build: CVR backend","step":"deleteDir"}'''
  build-build-frontend-assets:
    name: 'Build / Build: frontend assets'
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: 'Build: enter stage'
      id: s54
      if: env.action == 'apply'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: Checkout
      if: steps.s54.outputs.run == 'true'
      run: 'printf ''%s %s\n'' J2GHA-TRACE ''{"stage":"Build: frontend assets","step":"checkout"}'''
    - name: 'Build: frontend assets: deleteDir'
      id: s56
      if: steps.s54.outputs.run == 'true'
      run: 'printf ''%s %s\n'' J2GHA-TRACE ''{"stage":"Build: frontend assets","step":"deleteDir"}'''
  build-build-cvr-data-update-module:
    name: 'Build / Build: CVR data update module'
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: 'Build: enter stage'
      id: s64
      if: env.action == 'apply'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: Checkout
      if: steps.s64.outputs.run == 'true'
      run: 'printf ''%s %s\n'' J2GHA-TRACE ''{"stage":"Build: CVR data update module","step":"checkout"}'''
    - name: 'Build: CVR data update module: enter stage'
      id: s65
      if: (steps.s64.outputs.run == 'true') && (vars.J2GHA_WHEN_L450 == 'true')
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Build: CVR data update module: deleteDir'
      id: s67
      if: steps.s65.outputs.run == 'true'
      run: 'printf ''%s %s\n'' J2GHA-TRACE ''{"stage":"Build: CVR data update module","step":"deleteDir"}'''
  deploy:
    name: Deploy
    needs:
    - build-build-cvr-frontend
    - build-build-cvr-backend
    - build-build-frontend-assets
    - build-build-cvr-data-update-module
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: 'Deploy: Upload CVR frontend package: enter stage'
      id: s74
      if: vars.J2GHA_WHEN_L488 == 'true'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Deploy: Upload CVR backend package: enter stage'
      id: s79
      if: vars.J2GHA_WHEN_L507 == 'true'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Deploy: Upload CVR data update package: enter stage'
      id: s84
      if: vars.J2GHA_WHEN_L526 == 'true'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Deploy: Upload CVR frontend assets: enter stage'
      id: s92
      if: env.action == 'apply'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Deploy: Manifest: enter stage'
      id: s99
      if: env.action == 'apply'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
  load-test-data-to-db:
    name: Load test data to DB
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      run: printf '%s %s\n' J2GHA-TRACE '{"stage":"Load test data to DB","step":"checkout"}'
    - name: 'Load test data to DB: enter stage'
      id: s103
      if: vars.J2GHA_WHEN_L679 == 'true'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
  tests:
    name: Tests
    needs: load-test-data-to-db
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      run: printf '%s %s\n' J2GHA-TRACE '{"stage":"Tests","step":"checkout"}'
    - name: 'Tests: enter stage'
      id: s109
      if: env.action == 'apply' && env.skip_tests != 'true'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Tests: curl ${recallsApiGwUrl}${warmupPath} --output /dev/null'
      id: s111
      if: steps.s109.outputs.run == 'true'
      run: printf '%s %s\n' J2GHA-TRACE '{"stage":"Tests","step":"sh"}'
  post:
    name: post
    needs:
    - init
    - build-build-cvr-frontend
    - build-build-cvr-backend
    - build-build-frontend-assets
    - build-build-cvr-data-update-module
    - deploy
    - load-test-data-to-db
    - tests
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: 'Declarative: Post Actions: if (line 775)'
      id: s113
      if: (always()) && (env.clean_workspace == 'true')
      run: echo "taken=true" >> "$GITHUB_OUTPUT"
    - name: 'Declarative: Post Actions: if (line 775)'
      id: s114
      if: (always()) && (steps.s113.outcome == 'skipped')
      run: echo "taken=false" >> "$GITHUB_OUTPUT"
    timeout-minutes: 5
