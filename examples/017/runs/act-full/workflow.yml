        { echo 'buildUser<<J2GHA_EOF'; printf '%s\n' "$buildUser"; echo J2GHA_EOF; } >> "$GITHUB_ENV"
        { echo 'buildUser<<J2GHA_EOF'; printf '%s\n' "$buildUser"; echo J2GHA_EOF; } >> "$GITHUB_OUTPUT"
