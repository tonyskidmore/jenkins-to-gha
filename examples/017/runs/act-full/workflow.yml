  SKIP_TESTS: j2gha-stub
  FORCE_RELOAD_DATA: j2gha-stub
defaults:
  run:
    shell: bash
jobs:
  init:
    name: Init
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: 'Init: Check DB data completion: enter stage'
      id: s1
      if: env.action == 'apply'
      run: echo "run=true" >> "$GITHUB_OUTPUT"
    - name: 'Init: Check DB data completion: if (line 180)'
      id: s2
      if: (steps.s1.outputs.run == 'true') && (env.force_reload_data == 'true')
      run: echo "taken=true" >> "$GITHUB_OUTPUT"
    - name: 'Init: Check DB data completion: if (line 180)'
      id: s3
      if: (steps.s1.outputs.run == 'true') && (steps.s2.outcome == 'skipped')
      run: echo "taken=false" >> "$GITHUB_OUTPUT"
    - name: 'Init: Check DB data completion: info (manual migration)'
      id: s4
      if: (steps.s1.outputs.run == 'true') && (steps.s2.outputs.taken == 'true')
      run: echo "::warning::Jenkins step 'info' requires manual migration"
    - name: 'Init: Check DB data completion: Groovy for (manual)'
      id: s5
      if: (steps.s1.outputs.run == 'true') && (steps.s2.outputs.taken == 'true')
      run: 'echo "::warning::manual migration: Groovy for at line 135"'
    - name: 'Init: Check DB data completion: Groovy for (manual)'
