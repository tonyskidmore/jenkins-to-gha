# Harness unit tests and lint: one short Linux job on PRs and main, path-filtered to the code. j2gha's own remote runs
# use orphan branches that do not contain this file, so they never trigger it.
name: ci

on:
  pull_request:
    paths: ["j2gha/**", "tests/**", "docker/**", "pyproject.toml", "uv.lock", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["j2gha/**", "tests/**", "docker/**", "pyproject.toml", "uv.lock", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --group dev
      - run: uvx ruff@0.17.0 check j2gha tests --select F,E9,B --ignore B008
      - run: uv run pytest -q
